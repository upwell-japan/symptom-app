<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ACの箱のシール 試し印刷（A-one 12面）</title>
<style>
:root{--ink:#1d2024;--ink2:#5b6168;--rule:#d9d4ca;--paper:#f6f4ef}
*{box-sizing:border-box}
body{margin:0;font-family:'Meiryo','メイリオ','Noto Sans JP',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
header{background:var(--ink);color:#fff;padding:12px 20px;font-weight:700;font-size:18px}
main{max-width:1000px;margin:0 auto;padding:16px 20px 60px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.note{color:var(--ink2);font-size:13px;line-height:1.7;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);gap:4px}
input[type=number]{width:96px;font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--ink);border-radius:8px}
button{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:0}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.preview{overflow:auto;background:#d9d6cf;padding:16px;border-radius:12px}
.preview .sheet{transform:scale(var(--zoom,0.55));transform-origin:top left;margin-bottom:calc(-297mm * (1 - var(--zoom,0.55)) + 12px)}
.sheet{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.label{position:absolute;overflow:hidden;color:#000}
.label.guide{outline:0.3mm solid #999;border-radius:2mm}
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  header,main{display:none!important}
  #printArea{display:block}
  #printArea .sheet{box-shadow:none;break-after:page;page-break-after:always}
  #printArea .sheet:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<header>ACの箱のシール 試し印刷（A-one 12面・83.8×42.3mm）</header>
<main>
  <section class="panel">
    <h2>1. 印刷位置</h2>
    <p class="note">用紙：A-one のラベル（ZT31175。83.8×42.3mm・2列×6段・12面）。寸法は用紙のテンプレートの値です。ずれるときは、ここで直してください（このパソコンに記憶されます）。</p>
    <div class="row">
      <label class="f">左の余白（mm）<input type="number" id="mx" step="0.1"></label>
      <label class="f">上の余白（mm）<input type="number" id="my" step="0.1"></label>
      <label class="f">横の間隔（mm）<input type="number" id="gx" step="0.1"></label>
      <label class="f">縦の間隔（mm）<input type="number" id="gy" step="0.1"></label>
      <label class="f">下のマスの数<select id="cells" style="font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--ink);border-radius:8px"><option value="5" selected>5個</option><option value="6">6個</option></select></label>
      <button class="secondary" id="reset" type="button">初期値に戻す</button>
    </div>
  </section>
  <section class="panel">
    <h2>2. 印刷する</h2>
    <p class="note">まず普通の紙に「位置合わせ用の枠」を印刷して、ラベル用紙と重ねて光にすかし、位置が合っているか確かめてください。合っていたら、ラベル用紙に「見本のシール」を印刷します。印刷の画面では、倍率を「100」（実際のサイズ）、余白を「なし」にしてください。</p>
    <div class="row">
      <button class="secondary" id="guideBtn" type="button">位置合わせ用の枠を印刷する</button>
      <button class="primary" id="printBtn" type="button">見本のシールを印刷する（12枚）</button>
    </div>
  </section>
  <section class="panel">
    <h2>プレビュー（見本のシール）</h2>
    <div class="preview" id="preview"></div>
  </section>
</main>
<div id="printArea"></div>
<script>
const COLS = 2, ROWS = 6, PER = COLS * ROWS, LW = 83.8, LH = 42.3;   // mm
const POS_DEFAULT = { mx: 19.3, my: 21.5, gx: 3.8, gy: 0 };
const LS_POS = 'ac_label_pos_v2';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 見本のシール（12枚）
const SAMPLES = [
  ['DELL', '細丸', '65', 40], ['DELL', '細丸', '65', 15], ['FUJITSU', '丸口', '65', 20], ['FUJITSU', 'タイプC', '45', 30],
  ['LENOVO', '四角口', '45', 30], ['LENOVO', 'タイプC', '65', 25], ['HP', '太丸', '90', 10], ['NEC', 'タイプC', '45', 40],
  ['PANASONIC', '丸口', '65', 20], ['TOSHIBA', '丸口', '45', 18], ['MICROSOFT', '専用接続', '44', 8], ['VAIO', 'タイプC', '65', 12]
];
function loadPos() { try { return Object.assign({}, POS_DEFAULT, JSON.parse(localStorage.getItem(LS_POS) || '{}')); } catch (e) { return Object.assign({}, POS_DEFAULT); } }
function setInputs(p) { ['mx', 'my', 'gx', 'gy'].forEach(k => $(k).value = p[k]); }
function readPos() {
  const p = {};
  ['mx', 'my', 'gx', 'gy'].forEach(k => { const v = parseFloat($(k).value); p[k] = isNaN(v) ? POS_DEFAULT[k] : v; });
  try { localStorage.setItem(LS_POS, JSON.stringify(p)); } catch (e) {}
  return p;
}
// シール1枚（83.8×42.3mm）：左上にメーカー名、その下に口型とW、右に個数、下に数を書き直す4つのマス
function labelHtml(mk, conn, w, n) {
  const cells = parseInt($('cells').value, 10) || 5;
  const fsMk = mk.length > 9 ? 13 : 16;
  return `<div style="position:absolute;left:5mm;top:3.5mm;right:5mm;height:22mm;display:flex;align-items:center;font-family:'Meiryo','Noto Sans JP',sans-serif">
      <div style="flex:1;min-width:0;line-height:1.15">
        <div style="font-size:${fsMk}pt;font-weight:700;white-space:nowrap;overflow:hidden">${esc(mk)}</div>
        <div style="font-size:18pt;font-weight:700;white-space:nowrap">${esc(conn)}　${esc(w)}W</div></div>
      <div style="font-size:30pt;font-weight:700;white-space:nowrap;padding-left:2mm">${esc(n)}<span style="font-size:16pt">個</span></div></div>
    <div style="position:absolute;left:5mm;right:5mm;bottom:3.5mm;height:12mm;border:0.4mm solid #000;display:flex">
      ${Array.from({ length: cells }, (_, i) => `<div style="flex:1;${i < cells - 1 ? 'border-right:0.4mm solid #000' : ''}"></div>`).join('')}</div>`;
}
function sheetHtml(mode) {
  const p = readPos();
  let html = '<div class="sheet">';
  for (let k = 0; k < PER; k++) {
    const col = k % COLS, row = Math.floor(k / COLS);
    const style = `left:${p.mx + col * (LW + p.gx)}mm;top:${p.my + row * (LH + p.gy)}mm;width:${LW}mm;height:${LH}mm`;
    if (mode === 'guide') html += `<div class="label guide" style="${style}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20pt;color:#999">${k + 1}</div></div>`;
    else { const s = SAMPLES[k]; html += `<div class="label" style="${style}">${labelHtml(s[0], s[1], s[2], s[3])}</div>`; }
  }
  return html + '</div>';
}
function renderPreview() { $('preview').innerHTML = sheetHtml('labels'); }
function doPrint(mode) { $('printArea').innerHTML = sheetHtml(mode); setTimeout(() => window.print(), 50); }
setInputs(loadPos());
['mx', 'my', 'gx', 'gy'].forEach(k => $(k).addEventListener('input', renderPreview));
$('cells').addEventListener('change', renderPreview);
$('reset').onclick = () => { setInputs(POS_DEFAULT); renderPreview(); };
$('guideBtn').onclick = () => doPrint('guide');
$('printBtn').onclick = () => doPrint('labels');
window.addEventListener('afterprint', () => { $('printArea').innerHTML = ''; });
renderPreview();
</script>
</body>
</html>
