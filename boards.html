<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2024">
<meta name="robots" content="noindex, nofollow">
<title>看板の印刷</title>
<style>
:root{--ink:#1d2024;--ink2:#5b6168;--rule:#d9d4ca;--sand:#ece7dd;--amber:#e9a320;--amber-soft:#fdf1d8;--danger:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Meiryo','メイリオ','Noto Sans JP',system-ui,-apple-system,sans-serif;color:var(--ink);background:#f6f4ef;-webkit-tap-highlight-color:transparent}
header{background:var(--ink);color:#fff;padding:12px 16px;font-weight:700;font-size:17px;position:sticky;top:0;z-index:5}
main{max-width:900px;margin:0 auto;padding:14px 14px 48px}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.big{font-size:18px;font-weight:700;margin:0 0 6px}
.note{color:var(--ink2);font-size:14px;line-height:1.7;margin:6px 0}
.warn{color:var(--danger);font-size:14px;line-height:1.7;margin:6px 0;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--ink);border-radius:10px}
button{font:inherit;font-weight:700;border-radius:12px;min-height:56px;padding:0 20px;font-size:17px;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:0;flex:1 1 220px}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--ink);flex:1 1 160px}
.link{display:inline-block;margin-top:6px;color:var(--ink);font-size:15px}
.err{color:var(--danger);font-size:14px;min-height:1.2em;margin-top:6px}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.seg{background:#fff;color:var(--ink);border:1px solid var(--ink);min-height:72px;padding:6px 4px;font-size:24px;line-height:1.2}
.seg small{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.seg.cur{background:var(--amber-soft);border:3px solid var(--amber)}
.paper{background:#d9d6cf;border-radius:12px;padding:10px;overflow:hidden}
#stageWrap{position:relative;overflow:hidden}
#stage{transform-origin:top left;width:210mm;height:148mm}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ------------------ 看板（A5 横：210 × 148mm） ------------------ */
.sheet{width:210mm;height:148mm;background:#fff;color:#000;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sheet .in{position:absolute;left:12.7mm;top:7mm;width:184.9mm}
.sheet .head{display:flex;height:27.3mm;align-items:center;font-size:28pt;font-weight:700;white-space:nowrap}
.sheet .head .l{width:94.7mm;overflow:hidden}
.sheet .head .r{width:90.2mm;overflow:hidden}
.sheet .mid{display:flex;height:37.2mm;border-top:1mm dashed #000}
.sheet .mid .g{width:71.2mm;display:flex;align-items:center;justify-content:center;font-size:60pt;font-weight:700;line-height:1}
.sheet .mid .m{width:113.7mm;display:flex;align-items:center;font-size:18pt;font-weight:700;line-height:1.25;overflow:hidden;word-break:break-all}
/* 看板ID・数量の表：すべての線を同じ太さ（0.5mm）にする。隣り合うセルの線は1本に重ねる */
.sheet table.tb{border-collapse:collapse;table-layout:fixed;width:184.7mm}
.sheet table.tb td{border:0.5mm solid #000;padding:0;text-align:center;vertical-align:middle;overflow:hidden}
.sheet table.tb .lab{color:#b4b4b4;font-weight:700;font-size:10.5pt}
.sheet table.tb .id{font-size:20pt;font-weight:700;letter-spacing:.02em}
.sheet table.tb .cnt{font-size:28pt;font-weight:700}
.sheet table.tb tr.r1{height:35.3mm}
.sheet table.tb tr.r2{height:21.3mm}
.sheet table.tb .qr svg{width:32mm;height:32mm;display:block;margin:0 auto}

@page{size:210mm 148mm;margin:0}
@media print{
  html,body{background:#fff;height:auto;overflow:hidden}
  header,.ui,.paper-bar{display:none!important}
  main{padding:0;max-width:none;margin:0}
  .paper{background:none;padding:0;border-radius:0}
  #stageWrap{height:auto!important;overflow:visible!important}
  #stage{transform:none!important}
  .sheet{box-shadow:none;width:210mm;height:147mm;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  #list{display:none!important}
}

.f{display:block;font-size:14px;color:var(--ink2);margin:8px 0 4px}
input[type=password],input[type=number]{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--ink);border-radius:10px}
#pages{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mini{transform-origin:top left}
#list{font-size:14px;line-height:1.8;margin:6px 0}
</style>
</head>
<body>
<header>看板の印刷（在庫の看板）</header>
<main>
  <div class="card ui">
    <p class="big">1. 接続の設定</p>
    <p class="note">シール印刷のページと同じ、業務委託のGASのURLと委託キーです（シール印刷で記憶していれば、入力済みになっています）。</p>
    <label class="f">GASのURL<input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f">委託キー<input type="password" id="key"></label>
    <div class="row" style="margin-top:8px"><button class="secondary" id="saveConn" type="button">記憶する</button></div>
    <div class="err" id="connErr"></div>
  </div>
  <div class="card ui">
    <p class="big">2. 印刷する看板を選ぶ</p>
    <p class="note" id="remain">まだ印刷していない看板：－枚</p>
    <label class="f">1回に印刷する枚数<input type="number" id="count" value="50" min="1" max="100" inputmode="numeric"></label>
    <label class="f">しぼり込み（看板ID・キー・品名の一部。空なら全部）<input type="text" id="q" placeholder="例：261027DR"></label>
    <label class="note"><input type="checkbox" id="all"> 印刷済みの看板も表示する（刷り直し）</label>
    <div class="row" style="margin-top:8px"><button class="primary" id="loadBtn" type="button">表示する</button></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card ui" id="printCard" hidden>
    <p class="big">3. 印刷する</p>
    <p class="note" id="sel"></p>
    <div id="list"></div>
    <p class="note">印刷の画面で、用紙は「A5」・向きは「横」・倍率は「100%（実際のサイズ）」になっているか確かめてください。</p>
    <div class="row"><button class="primary" id="printBtn" type="button">印刷する</button>
      <button class="secondary" id="doneBtn" type="button">印刷できたので「印刷済み」にする</button></div>
    <div class="err" id="err2"></div>
  </div>
  <div id="pages"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ===============================================================
// 看板の印刷（在庫リストの「看板の無い在庫の看板を作る」で作った看板）
// ・業務委託_検査記録の「看板印刷」シートの、まだ印刷していない看板を、指定の枚数ずつ表示して印刷する
// ・印刷できたら「印刷済み」にする → 次に開いたときは、続きの看板が出る
// ===============================================================
const APP_URL = 'https://upwell-japan.github.io/symptom-app/itaku.html';   // 看板のQRの行き先
const LS_CONN = 'itaku_seal_conn_v1';   // シール印刷のページと同じ接続の設定を使う
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let shown = [];

function loadConn() { try { return JSON.parse(localStorage.getItem(LS_CONN) || '{}'); } catch (e) { return {}; } }
(() => { const c = loadConn(); $('url').value = c.url || ''; $('key').value = c.key || ''; })();
$('saveConn').onclick = () => {
  const url = $('url').value.trim(), key = $('key').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) { $('connErr').textContent = 'GASのURLは「https://script.google.com/macros/s/…/exec」の形で入力してください'; return; }
  if (!key) { $('connErr').textContent = '委託キーを入力してください'; return; }
  try { localStorage.setItem(LS_CONN, JSON.stringify({ url, key })); } catch (e) {}
  $('connErr').textContent = ''; alert('記憶しました');
};
async function call(fn, args) {
  const c = loadConn();
  if (!c.url || !c.key) throw new Error('先に「1. 接続の設定」を入力して「記憶する」を押してください');
  const res = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: [c.key].concat(args || []) }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.result;
}

function dateText(d) {
  const s = String(d == null ? '' : d).trim(), n = s.replace(/\D/g, '');
  if (n.length === 8) return n.slice(2);
  if (n.length === 6) return n;
  return s;
}
function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text); qr.make();
  const n = qr.getModuleCount(), q = 3;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="${-q} ${-q} ${n + 2 * q} ${n + 2 * q}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="${-q}" y="${-q}" width="${n + 2 * q}" height="${n + 2 * q}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function modelSize(name) { const n = String(name || '').length; return n > 40 ? 12 : n > 26 ? 15 : 18; }
// B・C・NG看板と同じ形。Aの看板は、QRに分類を入れない（Aとして読まれる）
function sheetHtml(b) {
  const url = APP_URL + '?k=' + encodeURIComponent(b.id) + (b.grade !== 'A' ? '&g=' + encodeURIComponent(b.grade) : '');
  return `<div class="sheet"><div class="in">
    <div class="head"><div class="l">入荷日: ${esc(dateText(b.date))}</div><div class="r">仕入先：${esc(b.supplier || '')}</div></div>
    <div class="mid">
      <div class="g">${esc(b.grade)}</div>
      <div class="m"><div style="font-size:${modelSize(b.name)}pt">型番：${esc(b.name || '')}</div></div>
    </div>
    <table class="tb">
      <colgroup><col style="width:22.7mm"><col style="width:24.5mm"><col style="width:23.9mm"><col style="width:23.5mm"><col style="width:22.5mm"><col style="width:22.4mm"><col style="width:22.4mm"><col style="width:22.8mm"></colgroup>
      <tr class="r1"><td class="lab">看板ID</td><td class="id" colspan="3">${esc(b.id)}</td><td class="qr" colspan="2">${qrSvg(url)}</td></tr>
      <tr class="r2"><td class="lab">数量</td><td class="cnt">${esc(b.qty)}</td>${'<td></td>'.repeat(6)}</tr>
    </table>
  </div></div>`;
}

$('loadBtn').onclick = async () => {
  $('err').textContent = '';
  const n = Math.min(100, Math.max(1, parseInt($('count').value, 10) || 50));
  $('loadBtn').disabled = true;
  try {
    const r = await call('kPrintList', [{ all: $('all').checked, q: $('q').value.trim() }]);
    $('remain').textContent = `まだ印刷していない看板：${r.remaining}枚`;
    shown = r.rows.slice(0, n);
    if (!shown.length) { $('printCard').hidden = true; $('pages').innerHTML = ''; $('err').textContent = '印刷する看板がありません'; return; }
    $('sel').textContent = `${shown.length}枚を表示しています（全部で${r.rows.length}枚）。` + (shown.some(x => x.printed) ? '印刷済みの看板も含みます。' : '');
    $('list').innerHTML = shown.map((x, i) => `${i + 1}. ${esc(x.id)}　${esc(x.grade)}　${esc(x.name)}　${esc(x.qty)}台${x.printed ? '（印刷済み）' : ''}`).join('<br>');
    $('pages').innerHTML = shown.map(sheetHtml).join('');
    $('printCard').hidden = false;
  } catch (e) { $('err').textContent = '読み込めませんでした：' + (e.message || e); }
  finally { $('loadBtn').disabled = false; }
};
$('printBtn').onclick = () => window.print();
$('doneBtn').onclick = async () => {
  $('err2').textContent = '';
  const items = shown.filter(x => !x.printed).map(x => ({ row: x.row, id: x.id, grade: x.grade }));
  if (!items.length) { $('err2').textContent = '印刷済みにする看板がありません'; return; }
  if (!confirm(`表示している看板 ${items.length}枚を「印刷済み」にします。全部きれいに印刷できましたか？`)) return;
  $('doneBtn').disabled = true;
  try {
    const r = await call('kMarkPrinted', [items]);
    alert(`${r.marked}枚を「印刷済み」にしました。続きを印刷するときは「表示する」を押してください。`);
    $('pages').innerHTML = ''; $('printCard').hidden = true; shown = [];
    $('loadBtn').click();
  } catch (e) { $('err2').textContent = '保存できませんでした：' + (e.message || e); }
  finally { $('doneBtn').disabled = false; }
};
</script>
</body>
</html>
