<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1d2024">
<meta name="robots" content="noindex, nofollow">
<title>症状入力</title>
<style>
:root{--ink:#1d2024;--ink2:#5b6168;--pill:#3a3f46;--sand:#ece7dd;--rule:#d9d4ca;--amber:#e9a320;--amber-soft:#fdf1d8;--danger:#b3261e;}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink);-webkit-tap-highlight-color:transparent}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:5;min-height:56px}
.title{font-weight:700;font-size:18px}
.pill{background:var(--pill);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.no{font-size:16px;flex:none}
.pill.name{min-width:0}
.pill.sync{background:var(--amber);color:var(--ink);flex:none}
.nav{flex:none;width:40px;height:40px;border-radius:999px;border:0;background:var(--pill);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.nav svg{width:22px;height:22px}
.lang{margin-left:auto;flex:none;background:var(--pill);color:#fff;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700}
main{padding:12px 14px 40px;max-width:760px;margin:0 auto}
h2{font-size:18px;font-weight:700;margin:16px 0 10px}
.group{background:var(--sand);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn{background:#fff;border:1px solid var(--ink);border-radius:10px;min-height:64px;padding:10px 8px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);position:relative;line-height:1.3;cursor:pointer}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--ink2);margin-top:3px}
.btn.other{border-style:dashed;color:var(--ink2)}
.btn.on{background:var(--amber-soft);border:2px solid var(--amber);cursor:default}
.btn.on::after{content:"✓";position:absolute;top:4px;right:8px;font-size:14px}
.badge{position:absolute;top:-7px;right:-7px;background:var(--amber);color:var(--ink);border-radius:999px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 7px}
.sel{list-style:none;padding:0;margin:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sel li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #eee;font-weight:700}
.sel li:first-child{border-top:0}
.sel small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.tag{font-size:11px;font-weight:700;border:1px solid var(--ink2);color:var(--ink2);border-radius:6px;padding:1px 6px;flex:none}
.tag.new{border-color:var(--amber);color:#8a5a00;background:var(--amber-soft)}
.x{margin-left:auto;flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-size:20px;color:var(--ink)}
.empty{color:var(--ink2);font-size:14px;padding:12px;border:1px dashed var(--rule);border-radius:12px}
.actions{display:flex;gap:10px;margin:20px 0 8px}
.primary,.secondary{flex:1;border-radius:12px;min-height:58px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:0}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.back{background:none;border:0;color:var(--ink2);font:inherit;font-size:15px;padding:8px 0;cursor:pointer}
.card{border:1px solid var(--rule);border-radius:14px;padding:16px;margin-top:12px}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.note{color:var(--ink2);font-size:14px;line-height:1.7;margin:8px 0}
label.field{display:block;font-size:14px;color:var(--ink2);margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--ink);border-radius:10px}
.err{color:var(--danger);font-size:14px;margin-top:6px;min-height:1em}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;font-size:14px;padding:10px 0;cursor:pointer}
.bat{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:12px 0 4px}
.bat.need{border:2px solid var(--amber);background:var(--amber-soft)}
.bat .lbl{font-weight:700;font-size:15px}
.bat .lbl small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.bat strong{margin-left:auto;font-size:22px;white-space:nowrap}
.bat strong.none{font-size:15px;color:#8a5a00}
.bat button{flex:none;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.batin{display:flex;align-items:center;gap:10px;max-width:240px;margin-top:8px}
.batin input[type=text]{font-size:34px;font-weight:700;text-align:right;padding:10px 14px}
.batin span{font-size:30px;font-weight:700}
.shots{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.shots img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);flex:none}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}
.markbox{background:#000;border-radius:12px;overflow:hidden;display:flex;justify-content:center}
#markCv{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;touch-action:none;cursor:crosshair}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000}
.cam video{display:block;width:100%;max-height:62vh;object-fit:cover}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid var(--amber);border-radius:12px;pointer-events:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;z-index:20}
#busy[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<input type="file" id="camPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="galPhoto" accept="image/*" multiple hidden>
<input type="file" id="camQr" accept="image/*" capture="environment" hidden>
<div id="busy" hidden></div>
<div id="toast" role="status"></div>

  photoOpt:   { ja: '同じ型番で写真が{n}枚そろっているので、撮影は任意です。', en: 'This model already has {n} photos of this defect, so a photo is optional.', id: 'Model ini sudah punya {n} foto untuk cacat ini, jadi foto tidak wajib.' },

  markHint:   { ja: '瑕疵の場所を、指で押したまま斜めになぞると四角で囲めます。囲まなくても進めます。', en: 'Press and drag diagonally to draw a box around the defect. You can also continue without a box.', id: 'Tekan dan geser diagonal untuk membuat kotak di sekitar cacat. Boleh lanjut tanpa kotak.' },
  markPhoto:  { ja: '写真', en: 'Photo', id: 'Foto' },
  undo:       { ja: '1つ戻す', en: 'Undo', id: 'Batalkan' },
  markNext:   { ja: '決定して次へ', en: 'OK, next', id: 'OK, berikutnya' },
  markDone:   { ja: '決定', en: 'OK', id: 'OK' },
  detTitle:   { ja: '内容を入力してください', en: 'Enter the details', id: 'Masukkan detail' },
  detDesc:    { ja: '何の症状か分かるように入力してください（例：Bluetooth、不明なデバイス）。英語やインドネシア語でもかまいません。', en: 'Describe what it is (e.g. Bluetooth, Unknown device). English or Indonesian is OK.', id: 'Tulis detailnya (mis. Bluetooth, Unknown device). Boleh bahasa Inggris atau Indonesia.' },

function t(key, n) { const s = (T[key] && (T[key][state.lang] || T[key].ja)) || key; return n === undefined ? s : s.replace('{n}', n); }

// ===============================================================
// 状態
// ===============================================================
const LS_DEVICE = 'symptom_device_id', LS_LANG = 'symptom_lang', LS_DRAFT = 'symptom_draft', LS_MASTER = 'symptom_master';
const LS_OK = 'symptom_device_ok', LS_NEED = 'symptom_photo_need', LS_OUTBOX = 'symptom_outbox';
const PHOTO_MAX = 1024;
const PHOTO_QUALITY = 0.7;
const state = {
  lang: loadLang(),
  deviceId: loadDeviceId(),
  screen: 'loading', back: 'open',
  owner: '', master: [], masterMap: {}, cats: [], photoNeed: 10,
  no: '', name: '', current: [], photoCounts: {},
  adds: new Map(), removes: new Set(),
  cat: '', photoFor: '', lastNone: false, error: '',
  addMeta: new Map(), photoOther: false, otherCat: '', otherDraft: '',
  unitLoaded: true, unitFailed: false,
  flow: null,   // 症状を選んでから登録するまでの途中経過 { base, detail, photo, size, upId }
  battery: '', batteryEdited: false, batteryThen: ''   // batteryThen：入力のあとに保存するとき 'done' / 'none'
};

function loadLang() {
  try { const v = localStorage.getItem(LS_LANG); if (LANGS.includes(v)) return v; } catch (e) {}

  return nav === 'id' || nav === 'in' ? 'id' : nav === 'en' ? 'en' : 'ja';
}
function loadDeviceId() {
  let id = '';
  try { id = localStorage.getItem(LS_DEVICE) || ''; } catch (e) {}
  if (!id) {
    id = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem(LS_DEVICE, id); } catch (e) {}
  }

}

// ===============================================================
// 下書き（「写真を選ぶ」などでページが破棄されても、途中経過を復元するため）
// ===============================================================
function saveDraft() {
  try {
    localStorage.setItem(LS_DRAFT, JSON.stringify({
      t: Date.now(), deviceId: state.deviceId, no: state.no, name: state.name,
      photoFor: state.photoFor, adds: [...state.adds], removes: [...state.removes],
      meta: [...state.addMeta], photoOther: state.photoOther, otherCat: state.otherCat,
      battery: state.battery, batteryEdited: state.batteryEdited, flow: state.flow
    }));
  } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(LS_DRAFT); } catch (e) {} }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_DRAFT) || 'null');
    if (d && d.no && d.deviceId === state.deviceId && Date.now() - d.t < 30 * 60 * 1000) return d;
  } catch (e) {}

}

// 画面に表示する「この台の症状」（保存済み − 取消 ＋ 今回追加）
function effective() {
  const list = [];
  state.current.forEach(c => { if (!state.removes.has(c.symptom)) list.push({ symptom: c.symptom, photo: c.photo, isNew: false, cat: c.cat, other: !!c.other }); });
  state.adds.forEach((photo, s) => { const m = state.addMeta.get(s) || {}; list.push({ symptom: s, photo: photo, isNew: true, cat: m.cat, other: !!m.other }); });
  // その他の症状は、そのカテゴリの最後に並べる
  const catIdx = c => { const i = state.cats.findIndex(x => x.cat === c); return i < 0 ? 99 : i; };
  const order = e => { const m = e.other ? null : state.masterMap[baseOf(e.symptom)]; return m ? catIdx(m.cat) * 1000 + m.idx % 1000 : catIdx(e.cat) * 1000 + 999; };
  list.forEach(e => { const m = e.other ? null : state.masterMap[baseOf(e.symptom)]; if (!e.cat && m) e.cat = m.cat; });
  return list.sort((a, b) => order(a) - order(b));
}
// 登録した名前（例：天板キズ(小)）から、症状マスタの「表記」を探す
function baseOf(name) {
  let s = String(name || '');
  if (state.masterMap[s]) return s;
  while (/\([^()]*\)$/.test(s)) {
    s = s.replace(/\([^()]*\)$/, '');
    if (state.masterMap[s]) return s;
  }
  return '';
}
const SIZES = ['大', '中', '小'];
const SIZE_TR = { '大': { en: 'Large', id: 'Besar' }, '中': { en: 'Medium', id: 'Sedang' }, '小': { en: 'Small', id: 'Kecil' } };
function flowName(f) { return f.base + (f.detail ? '(' + f.detail + ')' : '') + (f.size ? '(' + f.size + ')' : ''); }
function effectiveSet() { return new Set(effective().map(e => e.symptom)); }

// ===============================================================
// サーバー（GAS）とのやり取り
// ・Content-Type を text/plain にすると、ブラウザの事前確認なしで送れる
// ===============================================================
async function call(fn, args, busyKey) {
  if (busyKey) showBusy(t(busyKey));
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [] })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'error');
    return j.result;
  } finally {
    if (busyKey) hideBusy();
  }
}

// 起動：前回の症状マスタと許可の状態が残っていれば、通信を待たずにすぐ画面を出す
function start() {
  let cachedOk = false;
  try {
    const m = JSON.parse(localStorage.getItem(LS_MASTER) || 'null');
    if (m) setMaster(m);
    cachedOk = !!m && localStorage.getItem(LS_OK) === '1';
    state.photoNeed = Number(localStorage.getItem(LS_NEED)) || 10;
  } catch (e) {}
  const quick = cachedOk && !loadDraft();
  if (quick && INIT.no) { setUnit({ no: normalizeNo(INIT.no), name: INIT.name }, INIT.name, false); state.screen = 'cat'; }
  else if (quick) state.screen = 'open';
  else state.screen = 'loading';
  render();
  flushOutbox();

  const token = ++loadToken;
  call('apiInit', [state.deviceId, INIT.no]).then(r => {
    if (r.status === 'new' || r.status === 'pending') {
      try { localStorage.removeItem(LS_OK); } catch (e) {}
      state.screen = r.status === 'new' ? 'request' : 'pending';
      return render();
    }
    setMaster(r.master);
    state.owner = r.owner; state.photoNeed = r.photoNeed;
    try {
      localStorage.setItem(LS_MASTER, JSON.stringify(r.master));
      localStorage.setItem(LS_OK, '1');
      localStorage.setItem(LS_NEED, String(r.photoNeed));
    } catch (e) {}

    // 「写真を選ぶ」の途中でページが作り直された場合は、途中経過を復元する
    // （別の台のQRで開いたときは、下書きを捨てる）
    const d = loadDraft();
    const sameUnit = d && (!INIT.no || normalizeNo(INIT.no) === d.no);
    if (d && !sameUnit) clearDraft();
    if (sameUnit) {
      clearDraft();
      return call('apiLoadUnit', [state.deviceId, d.no]).then(info => {
        setUnit(info, d.name, false);
        applyUnitInfo(info);
        d.adds.forEach(([s, p]) => state.adds.set(s, p));
        d.removes.forEach(s => state.removes.add(s));
        (d.meta || []).forEach(([s, m]) => state.addMeta.set(s, m));
        state.photoOther = !!d.photoOther; state.otherCat = d.otherCat || '';
        if (d.batteryEdited) { state.battery = d.battery || ''; state.batteryEdited = true; }
        state.flow = d.flow || null;
        state.photoFor = d.photoFor; state.screen = 'photo';
        render(); toast(t('retake'));
      });
    }

    if (INIT.no) {
      if (!quick) { setUnit(r, INIT.name, false); state.screen = 'cat'; }
      if (token === loadToken) applyUnitInfo(r);
    } else if (!quick) state.screen = 'open';
    refresh();
  }).catch(e => {
    // すぐ出した画面はそのまま使える。登録済みの症状だけ読み直せるようにする
    if (quick) { if (INIT.no && token === loadToken) state.unitFailed = true; refresh(); return; }
    state.error = String(e.message || e); state.screen = 'error'; render();
  });
}

// カメラ表示中でなければ、今の画面を描き直す
function refresh() { if (state.screen !== 'camera' && state.screen !== 'scan') render(); }

function setMaster(master) {
  state.master = master; state.masterMap = {}; state.cats = [];
  master.forEach((m, i) => {
    m.idx = i; state.masterMap[m.h] = m;
    if (!state.cats.find(c => c.cat === m.cat)) state.cats.push({ cat: m.cat, en: m.catEn, id: m.catId });
  });
}

function setUnit(info, nameFromQr, loaded) {
  state.no = info.no; state.name = nameFromQr || info.name || '';
  state.current = info.current || []; state.photoCounts = info.photoCounts || {};
  state.adds = new Map(); state.removes = new Set(); state.cat = ''; state.lastNone = false;
  state.addMeta = new Map(); state.photoOther = false; state.otherCat = '';
  state.unitLoaded = loaded !== false; state.unitFailed = false;
  state.battery = batteryText(info.battery); state.batteryEdited = false; state.batteryThen = '';
  syncUrl();
}

// アドレスにも台の番号を残しておく（再読み込みしても同じ台が開く）
function syncUrl() {
  try {
    let q = '';
    if (state.no) {
      const p = new URLSearchParams({ no: state.no });
      if (state.name) p.set('name', state.name);
      q = '?' + p.toString();
    }
    history.replaceState(history.state, '', location.pathname + q);
  } catch (e) {}
}

// サーバーから届いた「登録済みの症状」を画面に反映する
// ・まだ送信待ちの保存があれば、その内容も重ねる（送信前でも正しい状態を見せる）
function applyUnitInfo(info) {
  if (!info || (info.no && normalizeNo(info.no) !== normalizeNo(state.no))) return;
  if (info.no) state.no = info.no;
  let cur = (info.current || []).slice();
  getOutbox().filter(j => normalizeNo(j.no) === normalizeNo(state.no)).forEach(j => {
    const rm = new Set(j.removes);
    cur = cur.filter(c => !rm.has(c.symptom));
    j.adds.forEach(a => { if (!cur.find(c => c.symptom === a.symptom)) cur.push({ symptom: a.symptom, photo: a.photo, cat: a.cat, other: !!a.other }); });
  });
  state.current = cur;
  state.photoCounts = info.photoCounts || {};
  if (!state.batteryEdited) {
    let bat = batteryText(info.battery);
    getOutbox().filter(j => normalizeNo(j.no) === normalizeNo(state.no) && batteryText(j.battery) !== '').forEach(j => { bat = batteryText(j.battery); });
    state.battery = bat;
  }
  if (!state.name && info.name) state.name = info.name;
  cur.forEach(c => state.adds.delete(c.symptom));   // 読み込み前に選んだものが登録済みなら、二重にしない
  state.unitLoaded = true; state.unitFailed = false;
}
// バッテリー容量を「0〜100の整数の文字」にする（入っていなければ ''）
function batteryText(v) {
  const s = String(v == null ? '' : v).trim();
  return /^\d{1,3}$/.test(s) && Number(s) <= 100 ? String(Number(s)) : '';
}
function normalizeNo(no) {
  return String(no || '').trim().replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[－ー―‐]/g, '-');
}

// 台を開く：画面はすぐに切り替え、登録済みの症状は裏で読み込む
let loadToken = 0;
function openUnit(no, name) {
  clearDraft();
  setUnit({ no: normalizeNo(no), name: name }, name, false);
  state.screen = 'cat'; render(); window.scrollTo(0, 0);
  loadUnit();
}
function loadUnit() {
  const token = ++loadToken, no = state.no;
  state.unitLoaded = false; state.unitFailed = false;
  call('apiLoadUnit', [state.deviceId, no]).then(info => {
    if (token !== loadToken || state.no !== no) return;
    applyUnitInfo(info); refresh();
  }).catch(() => {
    if (token !== loadToken || state.no !== no) return;
    state.unitFailed = true; refresh();
  });
}

// ---------------------------------------------------------------
// 保存：「完了」を押したらすぐ結果の画面を出し、送信は裏で行う
// ・送信待ちの記録はスマホに保存しておき、失敗しても自動で送り直す
// ---------------------------------------------------------------
function getOutbox() { try { return JSON.parse(localStorage.getItem(LS_OUTBOX) || '[]'); } catch (e) { return []; } }
function setOutbox(a) { try { localStorage.setItem(LS_OUTBOX, JSON.stringify(a)); } catch (e) {} }

async function save(none) {
  clearDraft();
  // 写真の送信は待たない（送信中の写真は、届きしだい記録の中身を差し替えてから送る）
  const job = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    no: state.no, name: state.name,
    adds: [...state.adds].map(([symptom, photo]) => {
      const m = state.addMeta.get(symptom);
      if (m && m.other) return { symptom, photo, other: true, cat: m.cat };
      if (m && m.base) { const o = { symptom: m.base, photo }; if (m.detail) o.detail = m.detail; if (m.size) o.size = m.size; return o; }
      return { symptom, photo };
    }),
    removes: [...state.removes], none: !!none, battery: state.battery
  };
  const box = getOutbox(); box.push(job); setOutbox(box);

  state.current = effective().map(e => ({ symptom: e.symptom, photo: e.photo, cat: e.cat, other: e.other }));
  state.adds = new Map(); state.removes = new Set(); state.addMeta = new Map();
  state.batteryEdited = false; state.batteryThen = '';
  state.lastNone = !!none; state.screen = 'result';
  render(); window.scrollTo(0, 0);
  flushOutbox();
}

let flushing = false, flushTimer = null;
async function flushOutbox() {
  if (flushing) return;
  flushing = true; clearTimeout(flushTimer);
  let sent = 0, failed = false;
  try {
    for (;;) {
      let job = getOutbox()[0];
      if (!job) break;
      // この記録に送信中の写真があれば、届くのを待つ（ページを開き直して行方が分からないものは、写真なしにする）
      const marks = [].concat(...job.adds.map(a => photoList(a.photo))).filter(isPending);
      if (marks.length) {
        await Promise.all(marks.map(m => uploadJobs.get(m) || Promise.resolve()));
        marks.forEach(m => { if (!uploadJobs.has(m)) replacePhoto(m, ''); });
        job = getOutbox().find(j => j.id === job.id);
        if (!job) continue;
        job.adds.forEach(a => { a.photo = photoJoin(photoList(a.photo).filter(x => !isPending(x))); });
      }
      try {
        var saved = await call('apiSave', [state.deviceId, job.no, job.name, job.adds, job.removes, job.none, job.battery]);
      } catch (e) { failed = true; break; }
      setOutbox(getOutbox().filter(j => j.id !== job.id));
      // 開いている台なら、サーバーに記録された内容（翻訳後の症状名など）に合わせる
      if (saved && normalizeNo(saved.no) === normalizeNo(state.no)) { applyUnitInfo(saved); refresh(); }
      sent++;
      renderHeader();
    }
  } finally {
    flushing = false;
    renderHeader();
    if (failed) { flushTimer = setTimeout(flushOutbox, 15000); toast(t('sendFail')); }
    else if (sent) toast(t('saved'));
  }
}
window.addEventListener('online', flushOutbox);

// ===============================================================
// 操作
// ===============================================================
// 症状を押したとき：詳細入力 → 写真 → 大きさ の順に、必要なものだけ進む
function pickSymptom(h) {
  const m = state.masterMap[h];
  if (!m) return;
  if (!m.detail && !m.size && effectiveSet().has(h)) return;
  state.photoOther = false;
  state.flow = { base: h };
  nextStep();
}
function nextStep() {
  const f = state.flow, m = f && state.masterMap[f.base];
  if (!m) { state.flow = null; state.screen = 'cat'; render(); return; }
  state.photoFor = f.base;
  if (m.detail && !f.detail) state.screen = 'detail';
  else if (m.photo && f.photo === undefined) state.screen = 'photo';
  else if (m.size && !f.size) state.screen = 'size';
  else return finishFlow();
  render(); window.scrollTo(0, 0);
}
function finishFlow() {
  clearDraft();
  const f = state.flow, key = flowName(f);
  state.flow = null;
  // 大きさの症状は、同じ症状の別の大きさと入れ替える
  if (f.size) {
    const re = new RegExp('^' + (f.base + (f.detail ? '(' + f.detail + ')' : '')).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\((大|中|小)\\)$');
    [...state.adds.keys()].forEach(k => { if (k !== key && re.test(k)) { state.adds.delete(k); state.addMeta.delete(k); } });
    state.current.forEach(c => { if (c.symptom !== key && re.test(c.symptom)) state.removes.add(c.symptom); });
  }
  if (state.removes.has(key)) state.removes.delete(key);
  else {
    state.adds.set(key, f.photo || '');
    const meta = { base: f.base, cat: (state.masterMap[f.base] || {}).cat, upId: f.upId };
    if (f.detail) meta.detail = f.detail;
    if (f.size) meta.size = f.size;
    state.addMeta.set(key, meta);
  }
  state.screen = 'cat'; state.cat = ''; render(); window.scrollTo(0, 0);
}
// 写真を撮り終わったとき
function afterPhoto(photo, upId) {
  if (state.flow && !state.photoOther) { state.flow.photo = photo; state.flow.upId = upId; nextStep(); return; }
  addSymptom(state.photoFor, photo, upId);
}
function addSymptom(h, photo, upId) {
  clearDraft();
  if (state.photoOther && h === state.photoFor) state.addMeta.set(h, { cat: state.otherCat, other: true, upId: upId });
  state.photoOther = false; state.otherDraft = '';
  if (state.removes.has(h)) state.removes.delete(h); else state.adds.set(h, photo || '');
  state.screen = 'cat'; state.cat = ''; render(); window.scrollTo(0, 0);
}
function removeSymptom(h) {
  if (state.adds.has(h)) { state.adds.delete(h); state.addMeta.delete(h); } else state.removes.add(h);
  render();
}

// 写真を裏で送る。画面はすぐ次に進める
// ・送信中の写真は「pending:番号」という目印にしておき、届いたら本当のURLに差し替える
// ・「完了」を押したあとに届いた場合も、送信待ちの記録の中身を差し替える
const pendingUploads = new Set();
const uploadJobs = new Map();   // 目印 → 送信中の処理
let uploadSeq = 0;
// 1つの症状の写真は、URL（または送信中の目印）を改行でつないだ文字で持つ
const PHOTO_LIMIT = 10;
const photoList = p => String(p || '').split('\n').map(x => x.trim()).filter(Boolean);
const photoJoin = a => a.filter(Boolean).join('\n');
function swapIn(p, mark, url) {
  const a = photoList(p);
  return a.includes(mark) ? photoJoin(a.map(x => x === mark ? url : x)) : null;
}
function replacePhoto(mark, url) {
  state.adds.forEach((p, s) => { const v = swapIn(p, mark, url); if (v !== null) state.adds.set(s, v); });
  state.current.forEach(c => { const v = swapIn(c.photo, mark, url); if (v !== null) c.photo = v; });
  if (state.flow && state.flow.photo) { const v = swapIn(state.flow.photo, mark, url); if (v !== null) state.flow.photo = v; }
  const box = getOutbox();
  let changed = false;
  box.forEach(j => j.adds.forEach(a => { const v = swapIn(a.photo, mark, url); if (v !== null) { a.photo = v; changed = true; } }));
  if (changed) setOutbox(box);
}
// 写真（1枚でも複数でも）を裏で送る。先に症状を追加して、カテゴリ画面に戻る
function uploadPhotos(dataUrls) {
  const h = state.photoFor, no = state.no;
  const marks = dataUrls.map(() => 'pending:' + Date.now() + '_' + (++uploadSeq));
  const upId = 'u' + uploadSeq;
  hideBusy();
  afterPhoto(photoJoin(marks), upId);
  toast(t('uploading'));
  let failed = 0, chain = Promise.resolve();
  marks.forEach((mark, i) => {
    // 1枚ずつ順に送る（電波が弱くても失敗しにくくするため）
    const p = chain.then(() => call('apiUploadPhoto', [state.deviceId, no, h, dataUrls[i]]))
      .then(r => {
        replacePhoto(mark, r.url);
        state.photoCounts[h] = (state.photoCounts[h] || 0) + 1;
      })
      .catch(() => { failed++; replacePhoto(mark, ''); })
      .then(() => { pendingUploads.delete(p); uploadJobs.delete(mark); });
    pendingUploads.add(p);
    uploadJobs.set(mark, p);
    chain = p;
  });
  chain.then(() => {
    if (failed && state.no === no) {
      const key = [...state.adds.keys()].find(k => (state.addMeta.get(k) || {}).upId === upId);
      if (key !== undefined) {
        // 「完了」の前で、1枚も送れなかったときは、症状を外して撮り直せるようにする
        if (!photoList(state.adds.get(key)).length) { state.adds.delete(key); state.addMeta.delete(key); alert(t('errSave')); }
        else alert(t('someFail'));
      } else if (state.flow && state.flow.upId === upId) {
        if (!photoList(state.flow.photo).length) { state.flow = null; state.screen = 'cat'; alert(t('errSave')); }
        else alert(t('someFail'));
      }
    }
    refresh();
  });
  return chain;
}
function uploadPhoto(dataUrl) { return uploadPhotos([dataUrl]); }
const isPending = v => typeof v === 'string' && v.indexOf('pending:') === 0;

// 「写真を選ぶ」、またはページ内カメラが使えない端末の撮影
async function onPhotoPicked(ev) {
  let files = Array.from((ev.target.files) || []);
  ev.target.value = '';
  if (!files.length) return;
  if (files.length > PHOTO_LIMIT) { files = files.slice(0, PHOTO_LIMIT); alert(t('camMax')); }
  try {
    showBusy(t('uploading'));
    const dataUrls = [];
    for (const f of files) dataUrls.push(await resizeImage(f, PHOTO_MAX, PHOTO_QUALITY));
    hideBusy();
    reviewPhotos(dataUrls);
  } catch (e) { hideBusy(); alert(t('errSave') + '\n' + (e.message || e)); }
}
['camPhoto', 'galPhoto'].forEach(id => document.getElementById(id).addEventListener('change', onPhotoPicked));

// ---------------------------------------------------------------
// ページ内カメラ（別アプリに切り替わらないので、ページが破棄されない）

let camStream = null, scanTimer = null;

}

// 瑕疵の撮影
async function openCamera() {

      <button class="secondary" id="camDone" type="button" disabled>${esc(t('camDone', 0))}</button></div>
    <button class="link" id="camCancel" type="button">${esc(t('cancel'))}</button>`;
  const v = document.getElementById('vid');
  v.srcObject = camStream;
  const snap = document.getElementById('snap'), doneB = document.getElementById('camDone');
  const update = () => {
    doneB.disabled = !shots.length;
    doneB.textContent = t('camDone', shots.length);
    snap.disabled = shots.length >= PHOTO_LIMIT;
    document.getElementById('shots').innerHTML = shots.map(d => `<img src="${d}" alt="">`).join('');
  };
  document.getElementById('camCancel').onclick = () => { stopCamera(); state.screen = 'photo'; render(); };
  snap.onclick = () => {
    if (!v.videoWidth) return;
    if (shots.length >= PHOTO_LIMIT) { toast(t('camMax')); return; }
    const r = Math.min(1, PHOTO_MAX / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    shots.push(c.toDataURL('image/jpeg', PHOTO_QUALITY));
    c.width = c.height = 0;
    update();
  };
  doneB.onclick = () => {
    if (!shots.length) return;
    stopCamera();
    reviewPhotos(shots.slice());
  };
}

// QRの読み取り（カメラを向けるだけで読み取る）
async function openScanner() {
  const back = state.screen === 'result' || state.screen === 'cat' ? state.screen : 'open';
  try { await loadJsQR(); } catch (e) { return alert(t('errLoad')); }
  try { await startCamera(640, 480); }
  catch (e) {
    // ページ内カメラが使えない場合は、QRを写真に撮って読み取る
    document.getElementById('camQr').click();
    return;
  }
  state.screen = 'scan'; state.back = back; renderHeader();
  $app.innerHTML = `<p class="note">${esc(t('scanDesc'))}</p>${cameraHtml(true)}
    <div class="actions"><button class="secondary" id="scanCancel" type="button">${esc(t('cancel'))}</button></div>
    <button class="link" id="scanNum" type="button">${esc(t('byNumber'))}</button>`;
  const v = document.getElementById('vid');
  v.srcObject = camStream;
  document.getElementById('scanCancel').onclick = () => { stopCamera(); state.screen = state.back; render(); };
  document.getElementById('scanNum').onclick = () => { stopCamera(); state.no = ''; state.name = ''; state.screen = 'open'; render(); };
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (state.screen !== 'scan' || !camStream) return;
    if (v.videoWidth) {
      const r = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(d.data, c.width, c.height, { inversionAttempts: 'dontInvert' });
      const unit = code && parseQr(code.data);
      if (unit) { stopCamera(); if (navigator.vibrate) navigator.vibrate(80); openUnit(unit.no, unit.name); return; }
    }
    scanTimer = setTimeout(tick, 250);   // 古い端末でも重くならないよう、1秒に4回だけ調べる
  };
  tick();
}

// QR読み取りの部品は、必要になったときに読み込む
let jsqrPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  if (!jsqrPromise) jsqrPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = resolve;
    s.onerror = () => { jsqrPromise = null; reject(new Error('jsQR')); };
    document.head.appendChild(s);
  });
  return jsqrPromise;
}

// ページ内カメラが使えない端末：QRを写真に撮って読み取る
document.getElementById('camQr').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  showBusy(t('loading'));
  let text = null;
  try {
    await loadJsQR();
    const img = await loadImage(file);
    for (const size of [1280, 800, 1800]) {
      const c = drawScaled(img, size);
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height);
      const code = jsQR(d.data, c.width, c.height);
      c.width = c.height = 0;
      if (code && code.data) { text = code.data; break; }
    }
  } catch (e) {}
  hideBusy();
  const unit = parseQr(text);
  if (!unit) return alert(t('qrFail'));
  openUnit(unit.no, unit.name);
});

function parseQr(text) {
  if (!text) return null;
  text = String(text).trim();
  try {
    const u = new URL(text);
    const no = u.searchParams.get('no');
    if (no) return { no: no.trim(), name: (u.searchParams.get('name') || '').trim() };
  } catch (e) {}
  const m = text.match(/^(\d+-\d+)(?:\|(.*))?$/);
  return m ? { no: m[1], name: m[2] || '' } : null;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}
function drawScaled(img, max) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// 最初から縮小して読み込むので、元画像を丸ごとメモリに載せない
async function resizeImage(file, max, quality) {
  try {
    const bmp = await createImageBitmap(file, { resizeWidth: max, resizeQuality: 'low' });
    const r = Math.min(1, max / Math.max(bmp.width, bmp.height));   // 縦長の写真も長い辺を max にそろえる
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    const url = c.toDataURL('image/jpeg', quality);
    c.width = c.height = 0;   // 作業用のメモリをすぐ手放す
    return url;
  } catch (e) {
    const img = await loadImage(file);
    return drawScaled(img, max).toDataURL('image/jpeg', quality);
  }
}

const $app = document.getElementById('app');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function trSym(h) { const m = state.masterMap[h]; return !m || state.lang === 'ja' ? '' : (state.lang === 'en' ? m.en : m.id); }
function trCat(c) { return state.lang === 'ja' ? '' : (state.lang === 'en' ? c.en : c.id); }
// 登録した名前の訳（例：天板キズ(小) → Top cover scratch (Small)）
function trName(name) {
  const b = baseOf(name);
  if (!b || state.lang === 'ja') return '';
  const tr = trSym(b);
  if (!tr) return '';
  return tr + name.slice(b.length).replace(/\((大|中|小)\)$/, (x, z) => '(' + SIZE_TR[z][state.lang] + ')');

const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

// ひとつ前の画面に戻る（選んだけれど「完了」していない症状は残す）
function goBack() {
  const S = state.screen;
  if (S === 'camera') { stopCamera(); state.screen = 'photo'; }
  else if (S === 'scan') { stopCamera(); state.screen = state.back; }
  else if (S === 'photo') { clearDraft(); state.flow = null; state.screen = state.photoOther ? 'other' : 'sym'; }
  else if (S === 'detail' || S === 'size') { state.flow = null; state.screen = 'sym'; }
  else if (S === 'other') { state.otherDraft = ''; state.screen = 'sym'; }
  else if (S === 'sym' || S === 'result') { state.screen = 'cat'; }
  else if (S === 'battery') { state.batteryThen = ''; state.screen = 'cat'; }
  else if (S === 'mark') { markJob = null; state.screen = 'photo'; }
  else if (S === 'cat') { goHome(); return; }
  else return;
  render(); window.scrollTo(0, 0);
}

// 最初の画面（台を開く）に戻る。保存していない症状があれば確かめる
function goHome() {
  if (state.screen !== 'result' && (state.adds.size || state.removes.size || state.batteryEdited) && !confirm(t('leaveAsk'))) return;
  stopCamera(); clearDraft(); markJob = null; state.flow = null;
  ++loadToken;   // 読み込み中の台の情報は使わない
  state.no = ''; state.name = ''; state.current = []; state.photoCounts = {};
  state.adds = new Map(); state.removes = new Set(); state.addMeta = new Map();
  state.cat = ''; state.photoFor = ''; state.photoOther = false; state.otherCat = ''; state.otherDraft = '';
  state.unitLoaded = true; state.unitFailed = false;
  state.battery = ''; state.batteryEdited = false; state.batteryThen = '';
  syncUrl();
  state.screen = 'open'; render(); window.scrollTo(0, 0);
}

// スマホの戻るボタンでアプリが閉じないよう、履歴に1つ目印を入れておく
function ensureGuard() {
  if (!NAV_SCREENS.has(state.screen)) return;
  try { if (!(history.state && history.state.symGuard)) history.pushState({ symGuard: 1 }, '', location.href); } catch (e) {}
}
window.addEventListener('popstate', () => {
  if (!NAV_SCREENS.has(state.screen)) { syncUrl(); return; }   // 最初の画面では、もう一度押すと前のページへ
  goBack();
  syncUrl();
  ensureGuard();
});

  renderHeader();
  document.documentElement.lang = state.lang;

  else if (S === 'sym') renderSym();
  else if (S === 'photo') renderPhoto();
  else if (S === 'other') renderOther();
  else if (S === 'result') renderResult();
  else if (S === 'battery') renderBattery();

    <div class="err" id="detErr"></div>

    <button class="link" id="detCancel" type="button">${esc(t('cancel'))}</button></div>`;
  const input = document.getElementById('detInput'), err = document.getElementById('detErr');
  input.oninput = () => { err.textContent = ''; };
  const next = () => {
    const v = input.value.replace(/[()（）]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!v) { err.textContent = t('detEmpty'); input.focus(); return; }
    const m = state.masterMap[f.base] || {};
    if (!m.size && effectiveSet().has(f.base + '(' + v + ')')) { err.textContent = t('otherDup'); input.focus(); return; }
    state.flow.detail = v; nextStep();
  };
  input.onkeydown = e => { if (e.key === 'Enter') next(); };
  document.getElementById('detNext').onclick = next;
  document.getElementById('detCancel').onclick = () => { state.flow = null; state.screen = 'sym'; render(); };
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 50);
}

// 大きさ（大・中・小）を選ぶ
function renderSize() {
  const f = state.flow || {};
  const nm = f.base + (f.detail ? '(' + f.detail + ')' : '');
  const n = photoList(f.photo).length;
  $app.innerHTML = `<div class="card"><p class="big">${esc(nm)}</p>${trSym(f.base) ? `<p class="note">${esc(trSym(f.base))}</p>` : ''}
    ${n ? `<p class="note">📷 ${esc(t('hasPhoto'))} ×${n}</p>` : ''}
    <h2>${esc(t('sizeTitle'))}</h2>
    <div class="group">${SIZES.map(z => `<button class="btn" type="button" data-size="${z}">${z}${sub(state.lang === 'ja' ? '' : SIZE_TR[z][state.lang])}</button>`).join('')}</div>
    <button class="link" id="sizeCancel" type="button">${esc(t('cancel'))}</button></div>`;
  $app.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { state.flow.size = b.dataset.size; nextStep(); });
  document.getElementById('sizeCancel').onclick = () => { state.flow = null; state.screen = 'sym'; render(); };
}

function renderResult() {
  const n = effective().length;
  $app.innerHTML = `<h2>${esc(t('selTitle'))}${n ? ` <span class="note">${esc(t('count', n))}</span>` : ''}</h2>
    ${state.lastNone ? `<div class="empty">${esc(t('resNone'))}</div>` : selectedListHtml(false)}
    ${batteryRowHtml(false)}
    <div class="actions"><button class="primary" id="nextBtn" type="button">${esc(t('next'))}</button></div>
    <div class="actions"><button class="secondary" id="fixBtn" type="button">${esc(t('fix'))}</button></div>
    <button class="link" id="numBtn" type="button">${esc(t('byNumber'))}</button>`;
  document.getElementById('nextBtn').onclick = openScanner;
  document.getElementById('fixBtn').onclick = () => { state.screen = 'cat'; render(); window.scrollTo(0, 0); };
  document.getElementById('numBtn').onclick = () => { state.no = ''; state.name = ''; state.screen = 'open'; render(); };
}

// ---------------------------------------------------------------
// バッテリー容量（必ず入力する。数字だけ・単位は％）
// ---------------------------------------------------------------
function batteryRowHtml(withButton) {
  const v = state.battery;
  const sub2 = state.lang === 'ja' ? '' : `<small>${esc(T.battery.ja)}</small>`;
  return `<div class="bat${v === '' && withButton ? ' need' : ''}"><span class="lbl">🔋 ${esc(t('battery'))}${sub2}</span>
    ${v === '' ? `<strong class="none">${esc(t('batNotSet'))}</strong>` : `<strong>${esc(v)}%</strong>`}
    ${withButton ? `<button type="button" id="batBtn">${esc(v === '' ? t('batEnter') : t('batChange'))}</button>` : ''}</div>`;
}

// 「完了」「症状なし」：バッテリー容量が未入力なら、先に入力の画面を出す
function finish(none) {
  if (state.battery === '') { openBattery(none ? 'none' : 'done'); return; }
  save(none);
}

function openBattery(then) {
  state.batteryThen = then || '';
  state.screen = 'battery'; render(); window.scrollTo(0, 0);
}

function renderBattery() {
  $app.innerHTML = `<div class="card"><p class="big">🔋 ${esc(t('battery'))}</p>
    <p class="note">${esc(t('batDesc'))}</p>
    <div class="batin"><input type="text" id="batInput" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" enterkeyhint="done" aria-label="${esc(t('battery'))}"><span>%</span></div>
    <div class="err" id="batErr"></div>
    <div class="actions"><button class="primary" id="batOk" type="button">${esc(state.batteryThen ? t('batOkSave') : t('batOk'))}</button></div></div>`;
  const input = document.getElementById('batInput');
  const err = document.getElementById('batErr');
  input.value = state.battery;
  // 全角の数字は半角にして、数字以外は入らないようにする
  input.oninput = () => {
    input.value = input.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '').slice(0, 3);
    err.textContent = '';
  };
  const ok = () => {
    const v = input.value;
    if (v === '') { err.textContent = t('batEmpty'); input.focus(); return; }
    if (Number(v) > 100) { err.textContent = t('batRange'); input.focus(); return; }
    const nv = String(Number(v));
    if (nv !== state.battery) { state.battery = nv; state.batteryEdited = true; }
    const then = state.batteryThen;
    state.batteryThen = '';
    if (then) save(then === 'none');
    else { state.screen = 'cat'; render(); window.scrollTo(0, 0); }
  };
  input.onkeydown = e => { if (e.key === 'Enter') ok(); };
  document.getElementById('batOk').onclick = ok;
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 50);
}

// ---------------------------------------------------------------
// 写真の確認：指で斜めになぞって、瑕疵の場所を四角で囲む（任意）
// ・複数枚のときは1枚ずつ順に出す。保存するのは枠を描き込んだ写真だけ
// ---------------------------------------------------------------
let markJob = null;   // { list: [dataUrl…], idx, out: [], rects: [], img }

function reviewPhotos(list) {
  if (!list.length) return;
  markJob = { list: list, idx: 0, out: [], rects: [], img: null };
  state.screen = 'mark'; render(); window.scrollTo(0, 0);
}

function drawMarks(ctx, img, rects, temp) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const lw = Math.max(3, Math.round(Math.max(W, H) * 0.006));
  ctx.drawImage(img, 0, 0, W, H);
  rects.concat(temp ? [temp] : []).forEach(r => {
    const x = Math.min(r.x1, r.x2), y = Math.min(r.y1, r.y2), w = Math.abs(r.x2 - r.x1), h = Math.abs(r.y2 - r.y1);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = lw + 4; ctx.strokeRect(x, y, w, h);   // 暗い所でも見えるよう白で縁取り
    ctx.strokeStyle = '#e53935'; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h);
  });
}

function renderMark() {
  const job = markJob;
  if (!job) { state.screen = 'photo'; render(); return; }
  const n = job.list.length, last = job.idx === n - 1;
  $app.innerHTML = `<p class="big" style="margin-top:12px">${esc(state.photoFor)}${n > 1 ? ` <span class="note">${esc(t('markPhoto'))} ${job.idx + 1} / ${n}</span>` : ''}</p>
    <p class="note">${esc(t('markHint'))}</p>
    <div class="markbox"><canvas id="markCv"></canvas></div>
    <div class="actions"><button class="secondary" id="undoBtn" type="button">${esc(t('undo'))}</button>
      <button class="primary" id="markOk" type="button">${esc(last ? t('markDone') : t('markNext'))}</button></div>
    <button class="link" id="markCancel" type="button">${esc(t('cancel'))}</button>`;
  const cv = document.getElementById('markCv'), ctx = cv.getContext('2d');
  const undo = document.getElementById('undoBtn');
  let temp = null;
  const redraw = () => { if (job.img) drawMarks(ctx, job.img, job.rects, temp); undo.disabled = !job.rects.length; };
  const setup = () => { cv.width = job.img.naturalWidth; cv.height = job.img.naturalHeight; redraw(); };
  if (job.img && job.img.dataset.i === String(job.idx)) setup();
  else {
    const img = new Image();
    img.dataset.i = String(job.idx);
    img.onload = () => { if (markJob === job) { job.img = img; setup(); } };
    img.src = job.list[job.idx];
  }
  undo.disabled = !job.rects.length;

  // 画面上の位置を、写真の中の位置に直す
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * cv.width / b.width, y: (e.clientY - b.top) * cv.height / b.height }; };
  cv.onpointerdown = e => {
    if (!job.img) return;
    e.preventDefault();
    const p = pos(e);
    temp = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  };
  cv.onpointermove = e => {
    if (!temp) return;
    const p = pos(e);
    temp.x2 = Math.max(0, Math.min(cv.width, p.x)); temp.y2 = Math.max(0, Math.min(cv.height, p.y));
    redraw();
  };
  cv.onpointerup = () => {
    if (!temp) return;
    const min = Math.max(cv.width, cv.height) * 0.03;   // 指が少しずれただけの小さい枠は描かない
    if (Math.abs(temp.x2 - temp.x1) >= min && Math.abs(temp.y2 - temp.y1) >= min) job.rects.push(temp);
    temp = null; redraw();
  };
  cv.onpointercancel = () => { temp = null; redraw(); };

  undo.onclick = () => { job.rects.pop(); redraw(); };
  document.getElementById('markCancel').onclick = () => { markJob = null; state.screen = 'photo'; render(); };
  document.getElementById('markOk').onclick = () => {
    if (!job.img) return;
    temp = null;
    let out = job.list[job.idx];
    if (job.rects.length) { drawMarks(ctx, job.img, job.rects, null); out = cv.toDataURL('image/jpeg', PHOTO_QUALITY); }
    job.out.push(out);
    job.idx++; job.rects = []; job.img = null;
    if (job.idx < n) { render(); window.scrollTo(0, 0); return; }
    markJob = null;
    uploadPhotos(job.out);
  };
}

function showBusy(msg) { const b = document.getElementById('busy'); b.textContent = msg; b.hidden = false; }
function hideBusy() { document.getElementById('busy').hidden = true; }
let toastTimer = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }

start();
setTimeout(() => loadJsQR().catch(() => {}), 3000);   // 画面が出たあとで、QR読み取りの部品を先読みする
</script>
