<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1d2024">
<meta name="robots" content="noindex, nofollow">
<title>業務委託 検査</title>
<style>
:root{--ink:#1d2024;--ink2:#5b6168;--pill:#3a3f46;--sand:#ece7dd;--rule:#d9d4ca;--amber:#e9a320;--amber-soft:#fdf1d8;--danger:#b3261e;--ok:#2e7d32;--ok-soft:#e5f2e6;--ng-soft:#fbe4e2}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink);-webkit-tap-highlight-color:transparent}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:5;min-height:56px}
.title{font-weight:700;font-size:18px}
.pill{background:var(--pill);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.id{font-size:16px;flex:none}
.pill.name{min-width:0}
.pill.sync{background:var(--amber);color:var(--ink);flex:none}
.lang{margin-left:auto;flex:none;background:var(--pill);color:#fff;border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700}
main{padding:12px 14px 40px;max-width:760px;margin:0 auto}
h2{font-size:18px;font-weight:700;margin:16px 0 10px}
.group{background:var(--sand);border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn{background:#fff;border:1px solid var(--ink);border-radius:10px;min-height:64px;padding:10px 8px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);position:relative;line-height:1.3;cursor:pointer;text-align:center}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--ink2);margin-top:3px}
.btn.on{background:var(--amber-soft);border:2px solid var(--amber);cursor:default}
.btn.on::after{content:"✓";position:absolute;top:4px;right:8px;font-size:14px}
.badge{position:absolute;top:-7px;right:-7px;background:var(--amber);color:var(--ink);border-radius:999px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 7px}
.sel{list-style:none;padding:0;margin:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sel li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #eee;font-weight:700}
.sel li:first-child{border-top:0}
.sel li.done{color:var(--ink2);font-weight:400;text-decoration:line-through}
.sel small{display:block;font-weight:400;font-size:12px;color:var(--ink2);text-decoration:none}
.sel a{color:var(--ink);font-size:13px;font-weight:400}
.tag{font-size:11px;font-weight:700;border:1px solid var(--ink2);color:var(--ink2);border-radius:6px;padding:1px 6px;flex:none;text-decoration:none}
.tag.new{border-color:var(--amber);color:#8a5a00;background:var(--amber-soft)}
.x{margin-left:auto;flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-size:20px;color:var(--ink)}
.chk{margin-left:auto;flex:none;width:26px;height:26px}
.empty{color:var(--ink2);font-size:14px;padding:12px;border:1px dashed var(--rule);border-radius:12px}
.actions{display:flex;gap:10px;margin:16px 0 8px}
.primary,.secondary{flex:1;border-radius:12px;min-height:58px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.primary{background:var(--ink);color:#fff;border:0}
.primary:disabled{opacity:.45}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.printarea{display:flex;flex-direction:column;gap:10px;align-items:flex-start;overflow-x:auto}
.sheet{width:210mm;height:148mm;background:#fff;color:#000;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}
.sheet .in{position:absolute;left:12.7mm;top:7mm;width:184.9mm}
.sheet .head{display:flex;height:27.3mm;align-items:center;font-size:28pt;font-weight:700;white-space:nowrap}
.sheet .head .l{width:94.7mm;overflow:hidden}
.sheet .head .r{width:90.2mm;overflow:hidden}
.sheet .mid{display:flex;height:37.2mm;border-top:1mm dashed #000}
.sheet .mid .g{width:71.2mm;display:flex;align-items:center;justify-content:center;font-size:60pt;font-weight:700;line-height:1}
.sheet .mid .m{width:113.7mm;display:flex;align-items:center;font-size:18pt;font-weight:700;line-height:1.25;overflow:hidden;word-break:break-all}
.sheet table.tb{border-collapse:collapse;table-layout:fixed;width:184.7mm}
.sheet table.tb td{border:0.5mm solid #000;padding:0;text-align:center;vertical-align:middle;overflow:hidden}
.sheet table.tb .lab{color:#b4b4b4;font-weight:700;font-size:10.5pt}
.sheet table.tb .id{font-size:20pt;font-weight:700;letter-spacing:.02em}
.sheet table.tb .cnt{font-size:28pt;font-weight:700}
.sheet table.tb tr.r1{height:35.3mm}
.sheet table.tb tr.r2{height:21.3mm}
.sheet table.tb .qr svg{width:32mm;height:32mm;display:block;margin:0 auto}
@media print{
  @page{size:210mm 148mm;margin:0}
  body.printing > *{display:none!important}
  body.printing{background:#fff;margin:0;padding:0}
  body.printing #app{display:block!important;padding:0;margin:0;max-width:none}
  body.printing #app > *{display:none!important}
  body.printing #app > #printArea{display:block!important;overflow:visible}
  body.printing .sheet{box-shadow:none;height:147mm;break-after:page;page-break-after:always}
  body.printing .sheet:last-child{break-after:auto;page-break-after:auto}
}
.sealbar{background:var(--amber-soft);border:3px solid var(--amber);border-radius:12px;padding:8px 12px;margin:0 0 10px;text-align:center}
.sealbar .lb{font-size:13px;color:var(--ink2);font-weight:700}
.sealbar .no{font-size:34px;font-weight:700;letter-spacing:.06em;line-height:1.25;font-variant-numeric:tabular-nums;word-break:break-all}
.sealbar .no.many{font-size:20px}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px 0 8px}
.navbar button{background:#fff;border:1px solid var(--ink);border-radius:999px;min-height:44px;padding:0 16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.hdhome{flex:none;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:700;margin-left:6px}
.back{display:none}   /* 上の「‹ 戻る」「⌂ ホーム」の帯に置き換えた（古いボタンは隠す） */
.card{border:1px solid var(--rule);border-radius:14px;padding:16px;margin-top:12px}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.note{color:var(--ink2);font-size:14px;line-height:1.7;margin:8px 0}
.warn{color:var(--danger);font-size:14px;line-height:1.7;margin:8px 0;font-weight:700}
label.field{display:block;font-size:14px;color:var(--ink2);margin:14px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--ink);border-radius:10px}
.err{color:var(--danger);font-size:14px;margin-top:6px;min-height:1em}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;font-size:14px;padding:10px 0;cursor:pointer}
.grade{display:inline-block;min-width:54px;text-align:center;border-radius:10px;padding:6px 12px;font-size:22px;font-weight:700;background:var(--sand)}
.grade.A{background:var(--ok-soft);color:var(--ok)}
.grade.NG{background:var(--ng-soft);color:var(--danger)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}   /* ピッキングの出荷先：3列で、文字を横書き1行に */
.dests button{min-height:64px;font-size:19px;white-space:nowrap;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.dests button.cur{border:3px solid var(--amber);background:var(--amber-soft)}
.grades button{min-height:76px;font-size:26px}
.grades button.cur{border:3px solid var(--amber);background:var(--amber-soft)}
.stick{border:3px solid var(--amber);background:var(--amber-soft);text-align:center}
.sealno{font-size:56px;font-weight:700;letter-spacing:.06em;margin:6px 0;font-variant-numeric:tabular-nums}
details.note summary{cursor:pointer;padding:8px 0}
.modes{display:grid;gap:10px}
.modes button{min-height:72px;font-size:20px}
.spec{list-style:none;padding:0;margin:0 0 10px}
.spec li{background:#fff;border:1px solid var(--rule);border-radius:12px;margin-bottom:8px;overflow:hidden}
.spec .sh{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:56px}
.spec .sl{flex:1;font-weight:700;font-size:16px}
.spec .sv{font-size:17px}
.spec .sv.need{background:var(--amber-soft);border:2px solid var(--amber);border-radius:8px;padding:2px 8px;font-weight:700}
.spec .sv.new{background:#e6f4ea;border:2px solid #1d6b2e;border-radius:8px;padding:2px 8px;font-weight:700}
.spec .sb{padding:0 14px 14px}
.spec .sb{display:grid;gap:8px}
.spec .sb.c3{grid-template-columns:repeat(3,1fr)}   /* 短い選択肢は3列、長い選択肢は2列。どのボタンも同じ大きさ */
.spec .sb.c2{grid-template-columns:repeat(2,1fr)}
.spec .sb button{width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:52px;padding:0 6px;font-size:16px}
.spec .sb .wide,.spec .sb .res,.spec .sb .link{grid-column:1/-1}
.spec .sb .res{display:flex;align-items:center;gap:8px;width:100%}
.spec .sb .res input{width:110px;font-size:22px;text-align:center}
.spec .sb .res b{font-size:26px}
.spec .sb button.cur{background:var(--amber-soft);border:3px solid var(--amber)}
.spec .sb input{font:inherit;font-size:18px;padding:10px;border:1px solid var(--ink);border-radius:10px;width:160px}
.spec .by{font-size:12px;color:var(--ink2);padding:0 14px 8px}
.grp{list-style:none;padding:0;margin:0 0 10px}
.grp li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.grp .gs{flex:1;font-size:15px;line-height:1.5}
.grp .gn{font-weight:700;white-space:nowrap}
.grp button{min-height:44px;padding:0 12px;font-size:15px}
.boxrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.boxrow input{width:84px;font:inherit;font-size:22px;padding:10px;border:1px solid var(--ink);border-radius:10px;text-align:center}
.boxrow span{font-size:17px}
.boxrow button{min-height:44px;padding:0 12px;font-size:15px}
.stocktotal{font-size:40px;font-weight:700;margin:6px 0}
.stockthumb{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:8px 0}
.diff{font-weight:700}.diff.plus{color:#1d6b2e}.diff.minus{color:var(--danger)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000}
.cam video{display:block;width:100%;max-height:62vh;object-fit:cover}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid var(--amber);border-radius:12px;pointer-events:none}
.mark{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:manipulation}
.mark canvas{display:block;width:100%;height:auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;z-index:20;text-align:center;padding:20px}
#busy[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<input type="file" id="camPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="camQr" accept="image/*" capture="environment" hidden>
<input type="file" id="stockPhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="acPhotoIn" accept="image/*" capture="environment" hidden>
<div id="busy" hidden></div>
<div id="toast" role="status"></div>
<script>
// ===============================================================
// ★ ここに 業務委託用の GAS のウェブアプリのURL（末尾が /exec）を貼る（通販のURLとは別）
// ===============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxQNpelUbbsIixIPD0ftLah_uww13ISkyVS-3KKma5nX0eVb9FkWxi76FDw5UdVlmA/exec';

// QRのURLの「?k=看板ID」「?s=シール番号」を受け取る
const INIT = (() => {
  const q = new URLSearchParams(location.search);
  return { k: (q.get('k') || '').trim(), s: (q.get('s') || '').trim(), ac: (q.get('ac') || '').trim() };
})();

// ===============================================================
// 表示する言語（日本語／English／Bahasa Indonesia）。保存されるデータは日本語のまま
// ===============================================================
const LANGS = ['ja', 'en', 'id'];
const LANG_LABEL = { ja: '日本語', en: 'English', id: 'Indonesia' };
const T = {

  errSave:   { ja: '保存できませんでした。通信を確認して、もう一度押してください。', en: 'Could not save. Check the connection and tap again.', id: 'Gagal menyimpan. Periksa koneksi lalu tekan lagi.' },
  retry:     { ja: 'もう一度読み込む', en: 'Load again', id: 'Muat ulang' },
  reqTitle:  { ja: 'この端末の利用を申請', en: 'Request access for this device', id: 'Ajukan izin untuk perangkat ini' },
  reqDesc:   { ja: '初めて使う端末です。端末の呼び名を入れて申請してください。管理者が許可すると使えるようになります。', en: 'This device is new. Enter a name and send a request. You can use the app after the manager approves it.', id: 'Perangkat ini baru. Masukkan nama lalu kirim permintaan. Aplikasi bisa dipakai setelah disetujui manajer.' },

  pendTitle: { ja: '許可を待っています', en: 'Waiting for approval', id: 'Menunggu persetujuan' },

  homeDesc:  { ja: '瑕疵を登録するときは「看板」のQRを、登録済みの台を見るときは「シール」のQRを読み取ってください。', en: 'To register a defect, scan the QR on the board. To see a registered unit, scan the QR on its sticker.', id: 'Untuk mendaftarkan cacat, pindai QR di papan. Untuk melihat unit terdaftar, pindai QR di stikernya.' },

  grpWait:   { ja: '送信待ちの台が{n}台あります。送信が終わると、まとまりに入ります。', en: '{n} units are waiting to be sent. They will appear in the groups after sending.', id: '{n} unit menunggu dikirim. Akan masuk kelompok setelah terkirim.' },

  grpDone:   { ja: '{n}台の分類を「{g}」に変えました', en: 'Changed {n} units to "{g}"', id: '{n} unit diubah menjadi "{g}"' },
  grpBack:   { ja: '看板の画面に戻る', en: 'Back to the board', id: 'Kembali ke papan' },
  grpAfter:  { ja: '分類を変え終わったら、案件管理のロットファイルで Ctrl+Shift+N を実行し直してください（内訳が新しい分類で作り直されます）。', en: 'After changing grades, run Ctrl+Shift+N again in the lot file (the breakdown is rebuilt with the new grades).', id: 'Setelah mengubah grade, jalankan lagi Ctrl+Shift+N di file lot (rincian dibuat ulang).' },
  regUnits:  { ja: 'この看板で登録した台（{n}台）', en: 'Units registered on this board ({n})', id: 'Unit terdaftar di papan ini ({n})' },
  noUnits:   { ja: 'まだ登録した台はありません。', en: 'No units registered yet.', id: 'Belum ada unit terdaftar.' },
  sealType:  { ja: 'QRが読めないときは、シール番号を入力（例：D00012）', en: 'If the QR cannot be read, type the sticker number (e.g. D00012)', id: 'Jika QR tidak terbaca, ketik nomor stiker (contoh: D00012)' },
  stickTitle:{ ja: 'このシールを貼ってください', en: 'Attach this sticker', id: 'Tempel stiker ini' },

function t(key, vars) {
  let s = (T[key] && (T[key][state.lang] || T[key].ja)) || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

  sealQueue: loadSealQueue(), nextSeal: '', nextErr: ''   // この端末が貼るシール（今の番号＋控えの番号）
};
state.nextSeal = state.sealQueue[0] || '';
const SEAL_KEEP = 2;   // 「今の番号」と「控えの番号」の2つを持っておく
function loadSealQueue() {
  try {
    const q = JSON.parse(localStorage.getItem('itaku_seal_queue') || 'null');
    if (Array.isArray(q)) return q;
    const old = localStorage.getItem('itaku_next_seal');   // 前の版で受け取っていた番号
    return old ? [old] : [];
  } catch (e) { return []; }
}
// サーバーでシールの番号が初期化されていたら（初期化した回数が変わっていたら）、控えの番号を捨てる
function checkSealEpoch(ep) {
  if (ep === undefined || ep === null) return false;
  ep = String(ep);
  let cur = null;
  try { cur = localStorage.getItem('itaku_seal_epoch'); } catch (e) {}
  if (cur === ep) return false;
  try { localStorage.setItem('itaku_seal_epoch', ep); } catch (e) {}
  if (!state.sealQueue.length) return false;
  state.sealQueue = []; saveSealQueue();
  return true;
}
function saveSealQueue() {
  state.nextSeal = state.sealQueue[0] || '';
  try { localStorage.setItem('itaku_seal_queue', JSON.stringify(state.sealQueue)); localStorage.removeItem('itaku_next_seal'); } catch (e) {}
}
// 今の番号を使い終えた（または使わない）ので、控えの番号を今の番号にする
function dropNextSeal(seal) {
  if (state.sealQueue[0] === seal) state.sealQueue.shift();
  else state.sealQueue = state.sealQueue.filter(x => x !== seal);
  saveSealQueue();
}
function loadLang() {
  try { const v = localStorage.getItem(LS_LANG); if (LANGS.includes(v)) return v; } catch (e) {}
  const nav = (navigator.language || 'ja').slice(0, 2);
  return nav === 'id' || nav === 'in' ? 'id' : nav === 'en' ? 'en' : 'ja';
}
function loadDeviceId() {   // 端末ID（許可は業務委託用のスプレッドシートの「端末の許可」シートで行う）
  let id = '';
  try { id = localStorage.getItem(LS_DEVICE) || ''; } catch (e) {}
  if (!id) {
    id = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem(LS_DEVICE, id); } catch (e) {}
  }
  return id;
}

// ===============================================================
// サーバー（GAS）とのやり取り
// ===============================================================
async function call(fn, args, busyKey) {
  if (busyKey) showBusy(t(busyKey));
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error || 'error'); e.server = true; throw e; }   // サーバーが断った（送り直しても同じ）
    return j.result;
  } finally {
    if (busyKey) hideBusy();
  }
}

// ===============================================================
// 裏で保存する仕組み（通販の症状入力アプリと同じ）
// ・「完了」を押したらすぐ次の画面に進み、保存はスマホに記録を残したまま裏で送る
// ・写真も裏で送り、届いてから記録を送る。通信が切れても、戻れば自動で送り直す
// ===============================================================
const LS_OUTBOX = 'itaku_outbox';
function getOutbox() { try { return JSON.parse(localStorage.getItem(LS_OUTBOX) || '[]'); } catch (e) { return []; } }
function setOutbox(a) { try { localStorage.setItem(LS_OUTBOX, JSON.stringify(a)); } catch (e) {} }
const isPending = v => typeof v === 'string' && v.indexOf('pending:') === 0;
const uploadJobs = new Map();   // 目印 → 送信中の写真
function replacePhoto(mark, url) {
  state.adds.forEach((p, s) => { if (p === mark) state.adds.set(s, url); });
  if (state.unit && state.unit.current) state.unit.current.forEach(c => { if (c.photo === mark) c.photo = url; });
  const box = getOutbox(); let changed = false;
  box.forEach(j => (j.adds || []).forEach(a => { if (a.photo === mark) { a.photo = url; changed = true; } }));
  if (changed) setOutbox(box);
}
function uploadInBackground(seal, symptom, dataUrl) {
  const mark = 'pending:' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const tryUpload = n => call('kUploadPhoto', [state.deviceId, seal, symptom, dataUrl]).catch(e => {
    if (n > 0 && !e.server) return new Promise(r => setTimeout(r, 3000)).then(() => tryUpload(n - 1));
    throw e;
  });
  const p = tryUpload(2).then(r => replacePhoto(mark, r.url))
    .catch(() => { replacePhoto(mark, ''); toast(t('photoFail', { s: seal })); })
    .then(() => { uploadJobs.delete(mark); renderHeader(); });
  uploadJobs.set(mark, p);
  return mark;
}
let flushing = null, flushTimer = null;
function flushOutbox() {
  if (flushing) return flushing;
  clearTimeout(flushTimer);
  flushing = (async () => {
    await null;   // 先に flushing を代入させてから始める（送る記録が無いときに、止まったままにならないように）
    let failed = false;
    for (;;) {
      let job = getOutbox()[0];
      if (!job) break;
      if (job.type === 'stock') {   // 棚卸しの記録
        try {
          await call('kSaveStock', [state.deviceId, job.boardId, job.grade, job.boxes, job.photo || '']);
          setOutbox(getOutbox().filter(j => j.id !== job.id));
        } catch (e) {
          if (e.server) { setOutbox(getOutbox().filter(j => j.id !== job.id)); alert(t('stockErr', { b: job.boardId, g: job.grade, m: e.message || e })); continue; }
          failed = true; break;
        }
        continue;
      }
      const marks = (job.adds || []).map(a => a.photo).filter(isPending);
      if (marks.length) {
        await Promise.all(marks.map(m => uploadJobs.get(m) || Promise.resolve()));
        marks.forEach(m => { if (!uploadJobs.has(m)) replacePhoto(m, ''); });   // 行方の分からない写真は、写真なしにする
        job = getOutbox().find(j => j.id === job.id);
        if (!job) continue;
        job.adds.forEach(a => { if (isPending(a.photo)) a.photo = ''; });
      }
      try {
        const u = await call('kSave', [state.deviceId, job.boardId, job.seal, job.adds, job.removes, !!job.newOnly]);
        setOutbox(getOutbox().filter(j => j.id !== job.id));
        if (u && u.photoCounts) Object.keys(u.photoCounts).forEach(k => { state.photoCounts[k] = Math.max(state.photoCounts[k] || 0, u.photoCounts[k]); });
        if (u && state.unit && state.unit.seal === u.seal && state.screen === 'unit' && !getOutbox().some(j => j.seal === u.seal)) { state.unit = u; render(); }
      } catch (e) {
        if (e.server) {   // 例：別の看板のシールだった → 送り直しても同じなので、記録を外して知らせる
          setOutbox(getOutbox().filter(j => j.id !== job.id));
          alert(job.newOnly && /すでに別の台/.test(String(e.message)) ? t('usedErr', { s: job.seal }) : t('sendErr', { s: job.seal, m: e.message || e }));
          continue;
        }
        failed = true; break;
      }
    }
    flushing = null;
    renderHeader();
    if (failed) { toast(t('sendFail')); flushTimer = setTimeout(flushOutbox, 15000); }
  })();
  return flushing;
}
window.addEventListener('online', () => flushOutbox());
// そのシールの記録が送信待ちなら、送り終わるまで待つ（修理・分類・読み直しの前）
async function waitSeal(seal) {
  if (!getOutbox().some(j => j.seal === seal)) return;
  showBusy(t('syncing'));
  try { await flushOutbox(); } finally { hideBusy(); }
}

function setMaster(m) {
  state.master = m; state.masterMap = {}; state.cats = [];
  m.forEach(x => { state.masterMap[x.h] = x; if (!state.cats.find(c => c.cat === x.cat)) state.cats.push({ cat: x.cat, en: x.catEn, id: x.catId }); });
}

function start() {
  try { const m = JSON.parse(localStorage.getItem(LS_KMASTER) || 'null'); if (m) setMaster(m); } catch (e) {}
  state.screen = 'loading'; render();
  flushOutbox();
  call('kInit', [state.deviceId]).then(r => {
    if (r.status === 'new' || r.status === 'pending') { state.screen = r.status === 'new' ? 'request' : 'pending'; return render(); }
    state.owner = r.owner; setMaster(r.master); state.photoNeed = r.photoNeed || 3;
    checkSealEpoch(r.sealEpoch);
    try { localStorage.setItem(LS_KMASTER, JSON.stringify(r.master)); } catch (e) {}
    if (INIT.s) return openSeal(INIT.s);
    if (INIT.k) return openBoard(INIT.k);
    if (INIT.ac) { state.screen = 'home'; render(); return openAcPlace(normId(INIT.ac)); }
    state.screen = 'home'; render();
  }).catch(e => { state.error = String(e.message || e); state.screen = 'error'; render(); });
}

// ===============================================================
// QRの中身を見分ける
//   看板：…itaku.html?k=261027SS-03 または 261027SS-03
//   シール：…itaku.html?s=D00012 または D00012
//   通販：…?no=564-03 または 564-03
// ===============================================================
function normId(s) {
  return String(s || '').trim().replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー―‐]/g, '-').toUpperCase();
}
function normSeal(s) { const m = normId(s).match(/^D?0*(\d+)$/); return m ? 'D' + String(Number(m[1])).padStart(5, '0') : normId(s); }
function parseCode(text) {
  if (!text) return null;
  text = String(text).trim();
  try {
    const u = new URL(text);
    const k = u.searchParams.get('k'), s = u.searchParams.get('s'), no = u.searchParams.get('no'), ac = u.searchParams.get('ac');
    if (ac) return { type: 'acPlace', id: normId(ac) };   // ACの看板（ロット）・パレットの看板
    if (k) { const g = String(u.searchParams.get('g') || '').toUpperCase(); return { type: 'board', id: normId(k), g: ['B', 'C', 'NG'].includes(g) ? g : 'A' }; }
    if (s) return { type: 'seal', id: normSeal(s) };
    if (no) return { type: 'ec', no: no, raw: text };
  } catch (e) {}
  const v = normId(text);
  if (/^D\d{1,6}$/.test(v)) return { type: 'seal', id: normSeal(v) };
  if (/^\d{6}[A-Z0-9]*-\d+$/.test(v)) return { type: 'board', id: v, g: 'A' };
  if (/^\d+-\d+$/.test(v)) return { type: 'ec', no: v, raw: text };
  return null;
}

// 読み取ったQRを、今の目的に合わせて処理する
let scanPurpose = 'any';
function handleCode(code) {
  if (!code) return alert(t('qrFail'));
  if (code.type === 'ec') { toast(t('ecMove')); location.href = 'index.html?no=' + encodeURIComponent(code.no); return; }
  if (code.type === 'acPlace') return handleAcPlace(code.id);   // ACの看板・パレットの看板
  if (scanPurpose === 'pickAc' || scanPurpose === 'pickAcAll') { const back = scanPurpose; scanPurpose = 'any'; alert(t('qrWrong')); state.screen = back; return render(); }
  if (scanPurpose === 'pick') {
    if (code.type !== 'board') { alert(t('qrWrong')); return pickScan(); }
    return openPickItem(code.id, code.g || 'A');
  }
  if (scanPurpose === 'moveTo') {
    if (code.type !== 'board') { alert(t('qrWrong')); state.screen = 'gradeBoard'; return render(); }
    return moveToBoard(code.id);
  }
  if (scanPurpose === 'grade') {
    if (code.type !== 'board') { alert(t('qrWrong')); return gradeScan(); }
    return openGradeBoard(code.id);
  }
  if (scanPurpose === 'ship') {
    if (code.type !== 'board') { alert(t('qrWrong')); return shipScan(); }
    return openShipItem(code.id, code.g || 'A');
  }
  if (scanPurpose === 'spec') {
    if (code.type !== 'board') { alert(t('qrWrong')); return openScanner(t('specScan')); }
    return openSpec(code.id);
  }
  if (scanPurpose === 'stock') {
    if (code.type !== 'board') { alert(t('qrWrong')); return openScanner(t('stockScan')); }
    return openStock(code.id, code.g || 'A');
  }
  if (scanPurpose === 'donor') {
    if (code.type !== 'seal') { alert(t('qrWrong')); return backAfterScan(); }
    return repairWithDonor(code.id, '');
  }
  if (scanPurpose === 'donorBoard') {
    if (code.type !== 'board') { alert(t('qrWrong')); return backAfterScan(); }
    return repairWithDonor(state.donorSeal, code.id);
  }
  if (code.type === 'board') {
    const switching = scanPurpose === 'sealForBoard';
    return openBoard(code.id, false).then(ok => { if (ok && switching) toast(t('boardSwitched', { b: state.board.name || state.board.id })); });
  }
  if (code.type === 'seal') return openSeal(code.id, scanPurpose === 'sealForBoard' && state.board ? state.board.id : '');
}
let scanBack = 'home';
function backAfterScan() { state.screen = scanBack; render(); }

// ===============================================================
// 看板・台を開く
// ===============================================================
// 次に貼るシールの番号を、裏で受け取っておく（すでに持っていれば何もしない）
let gettingSeal = null;
function ensureNextSeal() {
  if (gettingSeal) return gettingSeal;
  const need = SEAL_KEEP - state.sealQueue.length;
  if (need <= 0) return Promise.resolve();
  const wasEmpty = !state.nextSeal;
  state.nextErr = '';
  let reset = false;
  gettingSeal = call('kNextSeal', [state.deviceId, need]).then(r => {
    reset = checkSealEpoch(r.sealEpoch);   // 初期化されていたら、古い控えを捨ててから、新しい番号を入れる
    (r.seals || [r.seal]).forEach(x => { if (x && !state.sealQueue.includes(x)) state.sealQueue.push(x); });
    saveSealQueue();
  }).catch(e => { if (!state.nextSeal) state.nextErr = String(e.message || e); })   // 控えが受け取れないだけなら、知らせない
    .then(() => {
      gettingSeal = null;
      if (state.screen === 'board' && (wasEmpty || reset || state.nextErr)) render();
      if (reset) ensureNextSeal();         // 捨てた分の控えを、受け取り直す
    });
  return gettingSeal;
}
// 指示した番号で、新しい台の登録を始める
function startWithNextSeal() {
  if (!state.nextSeal) return;
  resetEdit();
  state.unit = { seal: state.nextSeal, registered: false, current: [], repaired: [], board: state.board, fromNext: true };
  state.screen = 'cat'; render(); window.scrollTo(0, 0);
}
// scanNext が true なら、看板を開いたあとすぐにシールを読む状態にする（貼ったシールを読み取って登録するとき）
function scanSealForBoard() {
  scanPurpose = 'sealForBoard'; scanBack = 'board';
  openScanner(t('nextSeal', { b: state.board.name || state.board.id }));
}
async function openBoard(id, scanNext) {
  try {
    const r = await call('kLoadBoard', [state.deviceId, normId(id)], 'loading');
    if (r.board && r.board.retired) { alert(t('boardRetired', { id: r.board.id })); state.screen = 'home'; render(); return; }
    state.board = r.board; state.boardUnits = r.units || [];
    checkSealEpoch(r.sealEpoch);
    const pc = r.photoCounts || {};
    Object.keys(state.photoCounts).forEach(k => { if (state.board.name && (pc[k] || 0) < state.photoCounts[k] && state.lastBoardBase === baseName(state.board.name)) pc[k] = state.photoCounts[k]; });
    state.photoCounts = pc; state.lastBoardBase = baseName(state.board.name || '');
    if (r.photoNeed) state.photoNeed = r.photoNeed;
    // まだ送信待ちの台も、一覧に出す
    getOutbox().forEach(j => {
      if (j.boardId === state.board.id && !state.boardUnits.some(u => u.seal === j.seal)) state.boardUnits.push({ seal: j.seal, grade: j.grade || 'NG', recheck: false });
    });
    state.screen = 'board'; render(); window.scrollTo(0, 0);
    ensureNextSeal();
    if (scanNext) scanSealForBoard();
    return true;
  } catch (e) { alert(t('errLoad') + '\n' + (e.message || e)); state.screen = 'home'; render(); return false; }
}

// boardId を渡したとき（看板→シールの順に読んだとき）は、未登録のシールをその看板の台として登録する
async function openSeal(seal, boardId) {
  seal = normSeal(seal);
  try {
    await waitSeal(seal);
    const u = await call('kLoadSeal', [state.deviceId, seal], 'loading');
    resetEdit();
    if (u.photoCounts) Object.keys(u.photoCounts).forEach(k => { state.photoCounts[k] = Math.max(state.photoCounts[k] || 0, u.photoCounts[k]); });
    if (u.photoNeed) state.photoNeed = u.photoNeed;
    if (u.registered) {
      if (boardId && u.board && u.board.id !== boardId) { alert(t('otherBoard', { s: seal, b: u.board.id })); state.screen = 'board'; return render(); }
      state.unit = u; state.board = u.board.missing ? state.board : u.board;
      state.screen = 'unit'; render(); window.scrollTo(0, 0); return;
    }
    if (!boardId) { alert(t('notReg')); state.screen = state.board ? 'board' : 'home'; return render(); }
    if (u.notPrinted) { alert(t('sealNotPrinted', { s: seal })); state.screen = 'board'; return render(); }
    if (u.assignedOther && !state.sealQueue.includes(seal)) { alert(t('sealOther', { s: seal })); state.screen = 'board'; return render(); }
    state.unit = { seal: seal, registered: false, current: [], repaired: [], board: state.board, fromNext: seal === state.nextSeal };
    state.screen = 'cat'; render(); toast(t('newUnit')); window.scrollTo(0, 0);
  } catch (e) { alert(t('errLoad') + '\n' + (e.message || e)); state.screen = state.board ? 'board' : 'home'; render(); }
}
// B・C・NG看板の印刷ページ（slip.html）を開く。GASのURLも引き継ぐ
function openSlip(boardId, grade) {
  try { localStorage.setItem('itaku_api_url', API_URL); } catch (e) {}
  location.href = 'slip.html?k=' + encodeURIComponent(boardId) + (['B', 'C', 'NG'].includes(grade) ? '&g=' + grade : '');   // 台の分類がB・C・NGなら、その看板を選んだ状態で開く
}
function baseName(n) { return String(n || '').trim().replace(/_\d+$/, ''); }
function resetEdit() { state.adds = new Map(); state.removes = new Set(); state.cat = ''; state.photoFor = ''; state.repairSel = new Set(); state.repairMsg = ''; }

// ===============================================================
// 症状の選択と保存
// ===============================================================
function effective() {
  const list = [];
  (state.unit.current || []).forEach(c => { if (!state.removes.has(c.symptom)) list.push(Object.assign({ isNew: false }, c)); });
  state.adds.forEach((photo, s) => { const m = state.masterMap[s] || {}; list.push({ symptom: s, photo: photo, cat: m.cat, isNew: true }); });
  const ord = s => { const m = state.masterMap[s]; return m ? m.co * 1000 + m.no : 99999; };
  return list.sort((a, b) => ord(a.symptom) - ord(b.symptom));
}
function pickSymptom(h) {
  const m = state.masterMap[h];
  if (!m || effective().some(e => e.symptom === h)) return;
  if (m.photo && state.unit && state.unit.batch) { alert(t('batchNoPhoto')); return; }
  if (m.photo) {
    const have = state.photoCounts[h] || 0;
    if (have >= state.photoNeed) { addSymptom(h, ''); toast(t('photoSkipped', { s: h, n: have })); return; }
    state.photoFor = h; openCamera(); return;   // 写真が必要なら、すぐカメラを開く
  }
  addSymptom(h, '');
}
function addSymptom(h, photo) {
  if (state.removes.has(h)) state.removes.delete(h); else state.adds.set(h, photo || '');
  state.screen = 'cat'; state.cat = ''; render(); window.scrollTo(0, 0);
}
function removeSymptom(h) { if (state.adds.has(h)) state.adds.delete(h); else state.removes.add(h); render(); }

function saveSymptoms() {
  if (state.unit && state.unit.batch) return saveBatch();
  const list = effective();
  if (!list.length && !state.unit.registered) return alert(t('needSym'));
  const boardId = (state.unit.board && state.unit.board.id) || (state.board && state.board.id) || '';
  const adds = [...state.adds].map(([symptom, photo]) => ({ symptom, photo }));
  const removes = [...state.removes];
  // 分類は、サーバーと同じ決め方でスマホでも先に決めて表示する
  const auto = list.every(e => state.masterMap[e.symptom] && state.masterMap[e.symptom].aOk) ? 'A' : 'NG';
  const changed = adds.length > 0 || removes.length > 0;
  const box = getOutbox();
  const fromNext = !!state.unit.fromNext;
  box.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2, 7), boardId, seal: state.unit.seal, adds, removes, grade: auto, newOnly: fromNext });
  setOutbox(box);
  const u = state.unit;
  state.unit = Object.assign({}, u, {
    registered: true, current: list.map(e => ({ symptom: e.symptom, hy: (state.masterMap[e.symptom] || {}).hy || e.symptom, photo: e.photo, cat: e.cat, kind: e.kind || '検査' })),
    auto: auto, sales: changed ? '' : u.sales, grade: changed ? auto : (u.sales || auto), recheck: false,
    board: u.board || state.board
  });
  resetEdit();
  flushOutbox();
  if (!u.registered && state.board) {
    // 新しく登録した台なら、看板の画面に戻って次の番号を指示する
    state.lastSaved = { seal: u.seal, t: Date.now() };
    if (!state.boardUnits.some(x => x.seal === u.seal)) state.boardUnits.push({ seal: u.seal, grade: auto, recheck: false });
    if (state.sealQueue.includes(u.seal)) dropNextSeal(u.seal);   // 控えの番号が、すぐ今の番号になる
    state.screen = 'board'; render(); window.scrollTo(0, 0);
    if (state.nextSeal) toast(t('savedNext', { s: u.seal, n: state.nextSeal }));
    else ensureNextSeal().then(() => toast(state.nextSeal ? t('savedNext', { s: u.seal, n: state.nextSeal }) : t('saved')));
    ensureNextSeal();
    return;
  }
  toast(t('saved'));
  state.screen = 'unit'; render(); window.scrollTo(0, 0);
}

let camStream = null, scanTimer = null, markImg = null, marks = [];
function stopCamera() { clearTimeout(scanTimer); scanTimer = null; if (camStream) { camStream.getTracks().forEach(tr => tr.stop()); camStream = null; } }
async function startCamera(w, h) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera');
  camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: w }, height: { ideal: h } }, audio: false });
  return camStream;
}
async function openCamera() {

  state.screen = 'camera'; renderHeader();
  $app.innerHTML = `${sealBarHtml('camera')}<div class="cam"><video id="vid" autoplay playsinline muted></video></div>
    <div class="actions"><button class="primary" id="snap" type="button" aria-label="${esc(t('shoot'))}">📷</button></div>
    <button class="link" id="camCancel" type="button">${esc(t('cancel'))}</button>`;
  const v = document.getElementById('vid'); v.srcObject = camStream;
  document.getElementById('camCancel').onclick = () => { stopCamera(); state.screen = 'sym'; render(); };
  document.getElementById('snap').onclick = () => {
    if (!v.videoWidth) return;
    const r = Math.min(1, PHOTO_MAX / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.9);
    stopCamera(); openMark(url);
  };
}
async function onPhotoPicked(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try { showBusy(t('loading')); const url = await resizeImage(file, PHOTO_MAX, 0.9); hideBusy(); openMark(url); }
  catch (e) { hideBusy(); alert(t('errSave') + '\n' + (e.message || e)); }
}
document.getElementById('camPhoto').addEventListener('change', onPhotoPicked);

function openMark(dataUrl) {
  const img = new Image();
  img.onload = () => { markImg = img; marks = []; state.screen = 'mark'; render(); window.scrollTo(0, 0); };
  img.src = dataUrl;
}
function drawMarks(canvas, w, h) {
  const ctx = canvas.getContext('2d');
  canvas.width = w; canvas.height = h;
  ctx.drawImage(markImg, 0, 0, w, h);
  const r = Math.min(w, h) * 0.08;
  ctx.lineWidth = Math.max(3, Math.min(w, h) * 0.012);
  ctx.strokeStyle = '#ff1e1e';
  marks.forEach(p => { ctx.beginPath(); ctx.arc(p.x * w, p.y * h, r, 0, Math.PI * 2); ctx.stroke(); });
}
function useMarkedPhoto() {
  if (!marks.length) return alert(t('needMark'));
  const c = document.createElement('canvas');
  drawMarks(c, markImg.naturalWidth, markImg.naturalHeight);
  const url = c.toDataURL('image/jpeg', PHOTO_QUALITY);
  c.width = c.height = 0;
  markImg = null; marks = [];
  const mark = uploadInBackground(state.unit.seal, state.photoFor, url);   // 写真は裏で送る。画面はすぐ戻る
  state.photoCounts[state.photoFor] = (state.photoCounts[state.photoFor] || 0) + 1;

// ===============================================================
// QRの読み取り（カメラを向けるだけ。使えない端末は写真に撮って読む）
// ===============================================================
let jsqrPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  if (!jsqrPromise) jsqrPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = resolve; s.onerror = () => { jsqrPromise = null; reject(new Error('jsQR')); };
    document.head.appendChild(s);
  });
  return jsqrPromise;
}
async function openScanner(desc) {
  try { await loadJsQR(); } catch (e) { return alert(t('errLoad')); }
  try { await startCamera(640, 480); } catch (e) { document.getElementById('camQr').click(); return; }
  state.screen = 'scan'; renderHeader();
  $app.innerHTML = `<p class="note">${esc(desc || t('scanDesc'))}</p>
    <div class="cam"><video id="vid" autoplay playsinline muted></video><div class="frame"></div></div>
    <div class="actions"><button class="secondary" id="scanCancel" type="button">${esc(t('cancel'))}</button></div>`;
  const v = document.getElementById('vid'); v.srcObject = camStream;
  document.getElementById('scanCancel').onclick = () => { stopCamera(); backAfterScan(); };
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (state.screen !== 'scan' || !camStream) return;
    if (v.videoWidth) {
      const r = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
      c.width = Math.round(v.videoWidth * r); c.height = Math.round(v.videoHeight * r);
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const code = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
      const parsed = code && parseCode(code.data);
      const justSaved = parsed && parsed.type === 'seal' && parsed.id === state.lastSaved.seal && Date.now() - state.lastSaved.t < 4000;
      if (parsed && !justSaved) { stopCamera(); if (navigator.vibrate) navigator.vibrate(80); handleCode(parsed); return; }
    }
    scanTimer = setTimeout(tick, 150);   // 1秒に約6回QRを探す
  };
  tick();
}
document.getElementById('camQr').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  showBusy(t('loading'));
  let text = null;
  try {
    await loadJsQR();
    const img = await loadImage(file);
    for (const size of [1280, 800, 1800]) {
      const cv = drawScaled(img, size);
      const code = jsQR(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
      cv.width = cv.height = 0;
      if (code && code.data) { text = code.data; break; }
    }
  } catch (e) {}
  hideBusy();
  handleCode(parseCode(text));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && camStream) {
    const s = state.screen; stopCamera();
    state.screen = s === 'scan' ? scanBack : 'sym'; render();
  }
});

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject; img.src = url;
  });
}
function drawScaled(img, max) {
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function resizeImage(file, max, quality) {
  const img = await loadImage(file);
  return drawScaled(img, max).toDataURL('image/jpeg', quality);
}

function moveSectionHtml(units) {

    <ul class="spec">${units.map(u => `<li><label class="sh" style="gap:12px"><input type="checkbox" data-mv="${esc(u.seal)}" ${sel.has(u.seal) ? 'checked' : ''} style="width:24px;height:24px">

function bindMoveSection() {
  $app.querySelectorAll('[data-mv]').forEach(c => c.onchange = () => {
    if (c.checked) state.moveSel.add(c.dataset.mv); else state.moveSel.delete(c.dataset.mv);

    if (b) { b.disabled = !state.moveSel.size; b.textContent = t('moveBtn', { n: state.moveSel.size }); }
  });
  const mb = document.getElementById('moveBtn');

async function moveToBoard(toId) {
  const from = state.board, seals = [...(state.moveSel || [])];
  toId = normId(toId);
  if (!seals.length) { state.screen = 'gradeBoard'; return render(); }
  if (toId === from.id) { alert(t('moveSame')); state.screen = 'gradeBoard'; return render(); }
  try {
    const r = await call('kLoadBoard', [state.deviceId, toId], 'loading');
    if (r.board.missing) { alert(t('boardMissing')); state.screen = 'gradeBoard'; return render(); }
    if (r.board.retired) { alert(t('boardRetired', { id: toId })); state.screen = 'gradeBoard'; return render(); }
    if (!confirm(t('moveAsk', { n: seals.length, from: from.id, to: toId, name: r.board.name || '' }))) { state.screen = 'gradeBoard'; return render(); }
    const res = await call('kMoveUnits', [state.deviceId, seals, toId], 'saving');
    toast(t('moveDone', { n: res.moved, to: toId }));
    state.moveSel = new Set();
    openGradeBoard(from.id);
  } catch (e) { alert(t('errSave') + '\n' + (e.message || e)); state.screen = 'gradeBoard'; render(); }
}

    });
  };

// ===============================================================
// 🏷 ACの箱のシール（40×40mm・4列×6段。番号入りQRシールと同じ用紙 TRUSCO 410-4552）
//   メーカー名・AC口型・Wを選ぶ → 1箱の個数（前に決めた数が入る）→ 枚数・開始位置 → 印刷
//   用紙の寸法は、シール発行のページ（seals.html）で合わせた値を使う
// ===============================================================
const ACB_COLS = 4, ACB_ROWS = 6, ACB_PER = 24, ACB_SIZE = 40;
const ACB_POS_DEFAULT = { mx: 17.5, my: 16, gx: 5, gy: 5 };
function acbPos() { try { return Object.assign({}, ACB_POS_DEFAULT, JSON.parse(localStorage.getItem('label_pos_v1') || '{}')); } catch (e) { return Object.assign({}, ACB_POS_DEFAULT); } }
async function openAcBox() {
  try {
    const r = await call('kAcBoxLoad', [state.deviceId], 'loading');
    const prev = state.acBox || {};
    state.acBox = { makers: r.makers || [], boxes: r.boxes || [], photos: r.photos || [], maker: prev.maker || '', conn: prev.conn || '', w: prev.w || '', n: '', copies: prev.copies || '1', start: '1', typing: false, photo: undefined, ok: false };
    acbFill();
    if (state.acBox.maker && state.acBox.conn && state.acBox.w) acbLoadPhoto();
    state.screen = 'acBox'; render(); window.scrollTo(0, 0);
  } catch (e) { alert(t('errLoad') + '\n' + (e.message || e)); acMenu(); }
}
function acbSaved() { const b = state.acBox; return b.boxes.find(x => acKey(x.maker, x.conn, x.w) === acKey(b.maker, b.conn, b.w)); }
function acbFill() { const b = state.acBox, s = acbSaved(); b.n = s ? String(s.n) : ''; }
// 選んだ種類の写真を読む（写真と見比べて「同じ」を押すまで、シールは作れない）
async function acbLoadPhoto() {
  const b = state.acBox;
  b.photo = undefined; b.ok = false;
  const key = acKey(b.maker, b.conn, b.w);
  try {
    const r = await call('kAcPhotoGet', [state.deviceId, b.maker, b.conn, b.w], 'loading');
    if (state.acBox !== b || acKey(b.maker, b.conn, b.w) !== key) return;
    b.photo = r.photo || null;
    b.similar = null; b.newOk = false;
    if (!b.photo) {   // 新しい種類：同じメーカーの、写真のあるACを見比べてもらう
      const l = await call('kAcPhotoList', [state.deviceId, b.maker], 'loading');
      if (state.acBox !== b || acKey(b.maker, b.conn, b.w) !== key) return;
      b.similar = (l.photos || []).filter(x => acKey(x.maker, x.conn, x.w) !== key)
        .sort((x, y) => (String(y.w) === String(b.w) ? 1 : 0) - (String(x.w) === String(b.w) ? 1 : 0));
    }
  } catch (e) { b.photo = null; b.similar = []; alert(t('errLoad') + '\n' + (e.message || e)); }
  if (state.screen === 'acBox') render();
}
function renderAcBox() {
  const b = state.acBox, saved = acbSaved();
  const connOpts = (SPEC_DEF['AC口型'] || {}).opts || [], wOpts = (SPEC_DEF['W'] || {}).opts || [];
  const btns = (list, cur, attr) => list.map(v => `<button class="secondary${String(cur) === String(v) ? ' cur' : ''}" type="button" ${attr}="${esc(v)}">${esc(v)}</button>`).join('');
  const ready = b.maker && b.conn && b.w;
  const hasPh = (m, c, w) => (b.photos || []).includes(acKey(m, c, w));
  let photoHtml = '';

// ACの写真を撮って保存する（小さい写真は画面用、元の写真はドライブへ）
document.getElementById('acPhotoIn').addEventListener('change', async ev => {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (state.screen === 'acTc' && state.acTc) return acTcPhoto(file);
  const b = state.acBox;
  if (!b || !(b.maker && b.conn && b.w)) return;
  try {
    showBusy(t('saving'));
    const full = await resizeImage(file, PHOTO_MAX, PHOTO_QUALITY);
    let thumb = await resizeImage(file, 360, 0.7);
    if (thumb.length > 44000) thumb = await resizeImage(file, 260, 0.6);
    hideBusy();
    const r = await call('kAcPhotoSave', [state.deviceId, b.maker, b.conn, b.w, thumb, full], 'saving');
    b.photo = r.photo; b.ok = true;
    const k = acKey(b.maker, b.conn, b.w);
    if (!(b.photos || []).includes(k)) (b.photos = b.photos || []).push(k);
    toast(t('acbPhotoSaved'));
    render();
  } catch (e) { hideBusy(); alert(t('errSave') + '\n' + (e.message || e)); }
});
// 種類の確認の画面で撮った写真を保存して、確認を終える
async function acTcPhoto(file) {
  const tc = state.acTc, ty = tc.type;
  try {
    showBusy(t('saving'));
    const full = await resizeImage(file, PHOTO_MAX, PHOTO_QUALITY);
    let thumb = await resizeImage(file, 360, 0.7);
    if (thumb.length > 44000) thumb = await resizeImage(file, 260, 0.6);
    hideBusy();
    await call('kAcPhotoSave', [state.deviceId, ty.maker, ty.conn, ty.w, thumb, full], 'saving');
    toast(t('acbPhotoSaved'));
    acTcDone(ty);
  } catch (e) { hideBusy(); alert(t('errSave') + '\n' + (e.message || e)); }

async function printAcBox() {
  const b = state.acBox;
  if (!b.ok) return alert(t('acbPhotoT'));
  const n = Math.floor(Number(b.n) || 0), copies = Math.floor(Number(b.copies) || 0), start = Math.floor(Number(b.start) || 1);
  if (n <= 0) return alert(t('acbNeedN'));
  if (copies <= 0 || copies > ACB_PER * 10) return alert(t('acbNeedCopies'));
  if (start < 1 || start > ACB_PER) return alert(t('acbNeedStart'));
  const saved = acbSaved();
  if (saved && saved.n !== n && !confirm(t('acbChangeAsk', { a: saved.n, b: n }))) return;
  try {
    if (!saved || saved.n !== n) { const r = await call('kAcBoxSave', [state.deviceId, b.maker, b.conn, b.w, n], 'saving'); b.boxes = r.boxes || b.boxes; }
  } catch (e) { return alert(t('errSave') + '\n' + (e.message || e)); }
  const labels = [];
  for (let i = 0; i < copies; i++) labels.push({ b: b, n: n });
  acPrintLabels(labels, start);
}

// ===============================================================
// ACの種類の写真の確認（種類を新しく足すときに使う）
//   写真があれば見比べる → 写真が無ければ、同じメーカーの写真のあるACと見比べる → どれとも違えば写真を撮る
//   opt.allowSwitch：写真のあるACと「同じ」だったときに、その種類に切り替えてよいか
//   onOk(type)：確認が済んだ種類（切り替えたときは、切り替えた種類）
// ===============================================================
async function acCheckType(type, onOk, opt) {
  opt = opt || {};
  const tc = { type: { maker: String(type.maker || '').trim().toUpperCase(), conn: type.conn, w: String(type.w) }, photo: undefined, similar: null, newOk: false,
               back: state.screen, onOk: onOk, allowSwitch: opt.allowSwitch !== false };
  state.acTc = tc; state.screen = 'acTc'; render(); window.scrollTo(0, 0);
  try {
    const r = await call('kAcPhotoGet', [state.deviceId, tc.type.maker, tc.type.conn, tc.type.w], 'loading');
    tc.photo = r.photo || null;
    if (!tc.photo) {
      const l = await call('kAcPhotoList', [state.deviceId, tc.type.maker], 'loading');
      const key = acKey(tc.type.maker, tc.type.conn, tc.type.w);
      tc.similar = (l.photos || []).filter(x => acKey(x.maker, x.conn, x.w) !== key)
        .sort((x, y) => (String(y.w) === String(tc.type.w) ? 1 : 0) - (String(x.w) === String(tc.type.w) ? 1 : 0));
    }
  } catch (e) { alert(t('errLoad') + '\n' + (e.message || e)); state.screen = tc.back; state.acTc = null; return render(); }
  if (state.acTc === tc) render();
}
function acTcDone(type) {
  const tc = state.acTc;
  state.acTc = null; state.screen = tc.back;
  tc.onOk(type);
  render(); window.scrollTo(0, 0);
}
function renderAcTc() {
  const tc = state.acTc, ty = tc.type, name = acTypeText(ty);
  let body;
  if (tc.photo === undefined || (!tc.photo && tc.similar === null)) body = `<p class="note">${esc(t('loading'))}</p>`;
  else if (tc.photo) body = `<div class="card"><p class="big">${esc(t('acbPhotoT'))}</p>
      <img src="${esc(tc.photo.thumb)}" alt="" style="width:100%;max-width:420px;display:block;margin:6px auto;border:1px solid var(--rule);border-radius:10px">
      <p class="note">${esc(t('acbPhotoBy', { w: tc.photo.by, t: tc.photo.at }))}</p>
      <div class="actions"><button class="primary" id="tcSame" type="button">${esc(t('acTcSame'))}</button></div>
      <div class="actions"><button class="secondary" id="tcBack" type="button">${esc(t('acbDiff'))}</button></div></div>`;
  else if (tc.similar.length && !tc.newOk) body = `<div class="card"><p class="big">${esc(t('acbNewT', { t: name }))}</p>
      <p class="warn">${esc(tc.allowSwitch ? t('acbNewAsk') : t('acTcNoSwitch'))}</p></div>
      ${tc.similar.map((x, i) => `<div class="card" style="margin-bottom:8px"><p class="big" style="margin:0">${esc(acTypeText(x))}</p>
        <img src="${esc(x.thumb)}" alt="" style="width:100%;max-width:420px;display:block;margin:6px auto;border:1px solid var(--rule);border-radius:10px">
        ${tc.allowSwitch ? `<div class="actions"><button class="secondary" type="button" data-tcs="${i}">${esc(t('acbThisSame'))}</button></div>` : ''}</div>`).join('')}
      <div class="actions"><button class="primary" id="tcNone" type="button">${esc(t('acbNoneSame'))}</button></div>`;
  else body = `<div class="card"><p class="big">${esc(name)}</p><p class="warn">${esc(t('acbNoPhoto'))}</p>
      <div class="actions"><button class="primary" id="tcShoot" type="button">${esc(t('acbShoot'))}</button></div></div>`;
  $app.innerHTML = `<div class="card"><p class="big">${esc(t('acTcTitle'))}</p><p class="note">${esc(name)}</p></div>${body}
    <button class="link" id="tcCancel" type="button">${esc(t('back'))}</button>`;
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on('tcSame', () => acTcDone(ty));
  on('tcBack', () => { state.screen = tc.back; state.acTc = null; render(); });
  on('tcCancel', () => { state.screen = tc.back; state.acTc = null; render(); });
  on('tcShoot', () => document.getElementById('acPhotoIn').click());
  on('tcNone', () => { if (!confirm(t('acbNoneAsk', { t: name }))) return; tc.newOk = true; render(); });
  $app.querySelectorAll('[data-tcs]').forEach(b => b.onclick = () => {
    const y = tc.similar[+b.dataset.tcs];

    state.acBulk = { info: r, items: r.items.map(x => Object.assign({}, x, { per: x.perBox ? String(x.perBox) : '', use: true, ok: false })), start: '1' };
    state.screen = 'acBulk'; render(); window.scrollTo(0, 0);
  } catch (e) { alert(t('errLoad') + '\n' + (e.message || e)); acMenu(); }
}
function acBulkSplit(n, per) {
  per = Math.floor(Number(per) || 0); n = Math.floor(Number(n) || 0);
  if (per <= 0 || n <= 0) return [];
  const out = [];
  for (let i = 0; i < Math.floor(n / per); i++) out.push(per);
  if (n % per) out.push(n % per);
  return out;
}
function acBulkSplitText(n, per) {
  const p = Math.floor(Number(per) || 0), full = p > 0 ? Math.floor(n / p) : 0, rest = p > 0 ? n % p : 0;
  if (p <= 0) return '';
  return [full ? t('acBulkFull', { p: p, b: full }) : '', rest ? t('acBulkRest', { r: rest }) : ''].filter(Boolean).join('＋');
}

      ${x.use ? `${x.photo ? `<img src="${esc(x.photo.thumb)}" alt="" style="width:100%;max-width:300px;display:block;margin:6px 0;border:1px solid var(--rule);border-radius:10px">` : ''}
        ${x.ok ? `<p class="note"><b>✅ ${esc(t('acbOk'))}</b></p>`

    <div id="printArea" class="printarea"></div>

// 写真を撮ったあと、写真を読み直す（確認済みの印は残す）
async function openAcBulkRefresh() {
  const a = state.acBulk;
  if (!a) return;
  try {
    const r = await call('kAcBoxBulkLoad', [state.deviceId, a.info.place], 'loading');
    const old = {};
    a.items.forEach(x => { old[acKey(x.maker, x.conn, x.w)] = x; });
    a.items = r.items.map(x => { const o = old[acKey(x.maker, x.conn, x.w)] || {}; return Object.assign({}, x, { per: o.per != null ? o.per : (x.perBox ? String(x.perBox) : ''), use: o.use !== false, ok: !!o.ok }); });
    if (state.screen === 'acBulk') render();
  } catch (e) {}
}
async function printAcBulk() {
  const a = state.acBulk, used = a.items.filter(x => x.use);
  const start = Math.floor(Number(a.start) || 1);
  if (!used.length) return alert(t('acBulkNone'));
  if (used.some(x => !x.ok)) return alert(t('acBulkNotReady'));
  if (used.some(x => !(Math.floor(Number(x.per) || 0) > 0))) return alert(t('acbNeedN'));
  if (start < 1 || start > ACB_PER) return alert(t('acbNeedStart'));
  const changed = used.filter(x => Math.floor(Number(x.per)) !== x.perBox);
  if (changed.some(x => x.perBox) && !confirm(t('acBulkChangeAsk', { l: changed.filter(x => x.perBox).map(x => acTypeText(x) + '：' + x.perBox + '→' + x.per).join('、') }))) return;
  try {
    for (const x of changed) { await call('kAcBoxSave', [state.deviceId, x.maker, x.conn, x.w, Math.floor(Number(x.per))], 'saving'); x.perBox = Math.floor(Number(x.per)); }
  } catch (e) { return alert(t('errSave') + '\n' + (e.message || e)); }
  const labels = [];
  used.forEach(x => acBulkSplit(x.n, x.per).forEach(n => labels.push({ b: x, n: n })));
  acPrintLabels(labels, start);
}
// シールを並べて印刷する（labels: [{ b: { maker, conn, w }, n }]）
function acPrintLabels(labels, start) {
  const p = acbPos(), slots = [];
  for (let k = 0; k < start - 1; k++) slots.push(null);
  labels.forEach(l => slots.push(l));
  let html = '';
  for (let s = 0; s < slots.length; s += ACB_PER) {
    html += '<div class="lsheet" style="width:210mm;height:296mm;position:relative;background:#fff;overflow:hidden;break-after:page;page-break-after:always">';
    slots.slice(s, s + ACB_PER).forEach((u, k) => {
      if (!u) return;
      const col = k % ACB_COLS, row = Math.floor(k / ACB_COLS);
      html += `<div style="position:absolute;width:${ACB_SIZE}mm;height:${ACB_SIZE}mm;left:${p.mx + col * (ACB_SIZE + p.gx)}mm;top:${p.my + row * (ACB_SIZE + p.gy)}mm;overflow:hidden">${acbLabelHtml(u.b, u.n)}</div>`;
    });
    html += '</div>';
  }
  const pa = document.getElementById('printArea');
  pa.innerHTML = html;
  const css = document.createElement('style');
  css.id = 'acbPrintCss';
  css.textContent = '@media print{@page{size:A4;margin:0}body.printing .lsheet:last-child{break-after:auto;page-break-after:auto}}';
  document.head.appendChild(css);
  document.body.classList.add('printing');
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.body.classList.remove('printing'); css.remove(); pa.innerHTML = ''; }, 500);
  }, 50);
}

// 看板の台を、内訳と同じ「分類＋症状」のまとまりに分ける（送信待ちの台は、まだ症状が分からないので入れない）
function boardGroups(units) {
  const order = { A: 0, B: 1, C: 2, NG: 3 };
  const map = new Map();
  units.forEach(u => {
    if (u.sym === undefined) return;
    const k = u.grade + '\t' + u.sym;
    if (!map.has(k)) map.set(k, { grade: u.grade, sym: u.sym, seals: [] });
    map.get(k).seals.push(u.seal);
  });
  return [...map.values()].sort((a, b) => (order[a.grade] ?? 9) - (order[b.grade] ?? 9) || a.sym.localeCompare(b.sym, 'ja'));
}
function boardGroupsHtml(units) {
  const groups = boardGroups(units);
  state.boardGroups = groups;
  const wait = units.filter(u => u.sym === undefined).length;
  if (!groups.length && !wait) return '';
  return `<h2>${esc(t('grpTitle'))}</h2>
    ${wait ? `<p class="warn">${esc(t('grpWait', { n: wait }))}</p>` : ''}
    <ul class="grp">${groups.map((g, i) => `<li><span class="grade ${esc(g.grade)}" style="font-size:16px;padding:4px 10px">${esc(g.grade)}</span>
      <span class="gs">${esc(g.sym || t('grpNone'))}</span><span class="gn">${esc(t('grpCount', { n: g.seals.length }))}</span>
      <button class="secondary" type="button" data-grp="${i}">${esc(t('grpChange'))}</button></li>`).join('')}</ul>`;
}

  $app.querySelectorAll('[data-fix]').forEach(cb => cb.onchange = () => { if (cb.checked) state.repairSel.add(cb.dataset.fix); else state.repairSel.delete(cb.dataset.fix); });
  const su = document.getElementById('srcUnit'); if (su) su.onclick = repairFromUnit;
  const sn = document.getElementById('srcNew'); if (sn) sn.onclick = repairNew;
}

function showBusy(msg) { const b = document.getElementById('busy'); b.textContent = msg; b.hidden = false; }
function hideBusy() { document.getElementById('busy').hidden = true; }
let toastTimer = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }

start();
setTimeout(() => loadJsQR().catch(() => {}), 3000);
</script>
